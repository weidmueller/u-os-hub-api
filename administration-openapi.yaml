    InterfaceConfig:
      type: object
      description: Represents the configuration of a single network interface.
      required:
      - ipv4_config
      properties:
        enabled:
          type: boolean
        ipv4_config:
          $ref: '#/components/schemas/Ipv4Config'
    InterfaceFailoverState:
      type: object
      description: Failover state of a single interface exposed via the network state endpoint.
      required:
      - state
      - fail_count
      - success_count
      properties:
        fail_count:
          type: integer
          format: int32
          description: Number of consecutive failed probes since the last success.
          minimum: 0
        state:
          $ref: '#/components/schemas/InterfaceProbeState'
          description: Current probe state of this interface.
        success_count:
          type: integer
          format: int32
          description: Number of consecutive successful probes since the last failure.
          minimum: 0
    InterfacePolicy:
      type: object
      description: |-
        Specifies the default action for packets that do not match any rule on a specific interface.

        This allows you to configure whether the rules are an allowlist or a blocklist.

        All physical interfaces must have a policy defined.
        But also non existing interfaces can be defined in the policy.
        This allows to configure policies for interfaces that may be added while runtime.
      required:
      - input
      - output
      - forward
      properties:
        forward:
          $ref: '#/components/schemas/PolicyType'
        input:
          $ref: '#/components/schemas/PolicyType'
        output:
          $ref: '#/components/schemas/PolicyType'
    InterfaceProbeState:
      type: string
      description: |-
        The current failover probe state of a monitored interface.

        - `HEALTHY`: Enabled and passing probes.
        - `PROBING`: Transitional state on the path to failure or recovery.
        - `FAILED`: Penalised — using an elevated metric because probes are failing.
      enum:
      - HEALTHY
      - PROBING
      - FAILED
    InterfaceState:
      type: object
      description: Represents the current state of a network interface.
      required:
      - type
      - ipv4
      properties:
        failover:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/InterfaceFailoverState'
            description: Failover state, present only when failover is configured globally.
        ipv4:
          $ref: '#/components/schemas/Ipv4State'
        type:
          $ref: '#/components/schemas/InterfaceType'
    InterfaceType:
      type: string
      description: The type of network interface.
      enum:
      - ETHERNET
      - USB
    Ipv4Config:
      type: object
      description: Represents the IPv4 configuration of a network interface.
      required:
      - dhcp
      - addresses
      - gateway
      - dns
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
        dhcp:
          type: boolean
        dns:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
        failover:
          $ref: '#/components/schemas/FailoverInterfaceConfig'
        gateway:
          oneOf:
          - type: 'null'
          - type: string
            format: ipv4
            description: Represents an IPv4 address in a string format.
        metric:
          type: integer
          format: int64
          description: |-
            Normal route metric (priority) for this interface. Lower values have higher priority.
            If a value of -1 is specified, the system will choose the metric automatically.

            If failover is enabled, the actual metric of the interface is
            dynamic and may change between metric and `failed_metric` depending on the probe state.
          example: 100
          maximum: 2147483647
          minimum: -1
        shared_mode:
          $ref: '#/components/schemas/SharedModeConfig'
    Ipv4PrefixLength:
      type: integer
      format: int32
      examples:
      - '24'
      maximum: 32
      minimum: 0
    Ipv4Route:
      type: object
      description: An IP route entry in the IPv4 routing table.
      required:
      - destination
      - gateway
      - interface
      - metric
      properties:
        destination:
          $ref: '#/components/schemas/Ipv4Subnet'
        gateway:
          $ref: '#/components/schemas/Ipv4String'
        interface:
          type: string
          example: eth-x4
        metric:
          type: integer
          format: int32
          example: 103
          minimum: 0
    Ipv4State:
      type: object
      description: Represents the IPv4 state of a network interface.
      required:
      - activated
      properties:
        activated:
          type: boolean
          description: Activated is true when the connection is active and a cable is plugged in. Otherwise false.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
    Ipv4String:
      type: string
      format: ipv4
      description: Represents an IPv4 address in a string format.
    Ipv4Subnet:
      type: object
      description: |-
        Ipv4 address with prefix length.

        The prefix length is used to determine the network mask.
      required:
      - ip
      - prefix_length
      properties:
        ip:
          $ref: '#/components/schemas/Ipv4String'
        prefix_length:
          $ref: '#/components/schemas/Ipv4PrefixLength'
    LogEntry:
      type: object
      required:
      - timestamp
      - message
      - source
      properties:
        message:
          type: string
          example: Log message
        source:
          $ref: '#/components/schemas/LogSource'
        timestamp:
          type: string
          format: date-time
    LogEntryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_cursor:
          type:
          - string
          - 'null'
    LogSource:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: u-os-adm
    LogSourcesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogSource'
    MasqueradeAction:
      type: object
      description: |-
        The source address is replaced depending on the routing destination
        (e.g. with the outgoing interface's IP address).
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - MASQUERADE
    Memory:
      type: object
      required:
      - total_size
      - available_size
      properties:
        available_size:
          type: integer
          format: int64
          minimum: 0
        total_size:
          type: integer
          format: int64
          minimum: 0
    NatRules:
      type: object
      required:
      - prerouting
      - postrouting
      properties:
        postrouting:
          type: object
          description: Postrouting masquerade and snat rules
          additionalProperties:
            $ref: '#/components/schemas/PostroutingRule'
          propertyNames:
            type: string
            description: Identifier of a firewall rule. Used as the map key and to reference it in patch operations.
            pattern: ^[A-Za-z0-9:._-]{1,63}$
        prerouting:
          type: object
          description: Prerouting DNAT rules
          additionalProperties:
            $ref: '#/components/schemas/PreroutingRule'
          propertyNames:
            type: string
            description: Identifier of a firewall rule. Used as the map key and to reference it in patch operations.
            pattern: ^[A-Za-z0-9:._-]{1,63}$
    NetworkConfig:
      type: object
      description: Used for writing the network configuration. All fields are required to be present, but can be empty in some cases.
      required:
      - hostname
      - interfaces
      properties:
        failover:
          $ref: '#/components/schemas/FailoverGlobalConfig'
          description: Global failover probe settings.
        hostname:
          type: string
          format: hostname
          example: wm-uc20-m3000
          maxLength: 63
          minLength: 1
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InterfaceConfig'
          propertyNames:
            type: string
          example:
            eth-x4:
              enabled: true
              ipv4_config:
                addresses:
                - ip: 192.168.1.102
                  prefix_length: 24
                dhcp: false
                dns:
                - 8.8.8.8
                failover:
                  enabled: true
                  failed_metric: 20000
                  probe_target: dns.google
                gateway: 192.168.1.1
                metric: 200
                shared_mode:
                  dhcp_ip_range:
                    end: 192.168.1.150
                    start: 192.168.1.103
                  dhcp_lease_time_sec: 3600
                  enabled: true
            eth-x5:
              enabled: false
              ipv4_config:
                addresses: []
                dhcp: true
                dns: []
                failover:
                  enabled: true
                  failed_metric: 20001
                  probe_target: 1.1.1.1
                gateway: null
                metric: 100
                shared_mode:
                  dhcp_ip_range: null
                  dhcp_lease_time_sec: null
                  enabled: false
        service_interface:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ServiceInterfaceConfig'
    NetworkState:
      type: object
      description: |-
        The current network state on the device.

        Note that this may differ from the configuration, e.g. a DHCP interface has an address in the state, but not in the configuration.
      required:
      - dns_resolver
      - routes
      - interfaces
      properties:
        dns_resolver:
          $ref: '#/components/schemas/GlobalDnsServers'
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InterfaceState'
          propertyNames:
            type: string
          example:
            eth-x4:
              ipv4:
                activated: true
                addresses:
                - ip: 192.168.1.100
                  prefix_length: 24
              type: ETHERNET
            eth-x5:
              ipv4:
                activated: true
                addresses:
                - ip: 192.168.1.101
                  prefix_length: 24
              type: ETHERNET
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Route'
    OperationState:
