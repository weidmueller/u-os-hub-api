openapi: 3.1.0
info:
  title: Administration API
  description: HTTP API for administrating a u-OS device.
  contact:
    name: Weidmüller
  license:
    name: MIT
    identifier: MIT
  version: 1.3.0-next
servers:
- url: /u-os-adm/api/v1
paths:
  /logging/entries:
    get:
      tags:
      - logging
      summary: Get all log entries.
      description: The entries can be filtered and accessed via pagination.
      operationId: get_logging_entries
      parameters:
      - name: cursor
        in: query
        description: |-
          The cursor is used to paginate through the log entries.
          It's empty for the first page.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          Number of requested entries.
          Default is 100.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: sources
        in: query
        description: |-
          Filter parameter for log sources.
          The exact name of the source must be indicated.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: filter_msgs
        in: query
        description: |-
          Only include log entries whose message contains all filter-strings.
          Not case sensitive. If not set or empty, all messages will be included.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Log entries found sucessfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryResponse'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/reports:
    post:
      tags:
      - logging
      summary: Trigger the generation of a report.
      description: |-
        The report will contain the current system logs.
        The report generation is a long-running operation.
        You can poll the status of the operation using the `/operations/{operation_id}` endpoint.
      operationId: create_logging_report
      responses:
        '202':
          description: The generation of the report has been started successfully.
          headers:
            Location:
              schema:
                type: string
              description: URL of the operation resource to poll for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLogReportResponse'
        '409':
          description: A report generation is already in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/reports/{report_id}:
    get:
      tags:
      - logging
      summary: Get the report by the given report_id.
      description: |-
        The report is a gzipped tar archive containing all system logs.
        You need to trigger the report generation first using the `/logging/reports` endpoint.
      operationId: get_logging_report
      parameters:
      - name: report_id
        in: path
        description: ID of the report to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Report found sucessfully
          content:
            application/octet-stream: {}
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/sources:
    get:
      tags:
      - logging
      summary: Get available log sources.
      description: All log sources will be listed here, for examples all systemd services.
      operationId: get_logging_sources
      responses:
        '200':
          description: Log sources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogSourcesResponse'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /network/config:
    get:
      tags:
      - network
      summary: Get the current network configuration of the device.
      description: This only returns fields that can be configured and changed via the HTTP API.
      operationId: get_network_config
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readonly
      - OAuth2:
        - u-os-adm.network.readwrite
    put:
      tags:
      - network
      summary: Set the full network configuration of the device.
      description: |-
        This endpoint sets the network configuration of the device. Must include all supported settings and interfaces.
        Will return the updated configuration on success.

        Note that some network properties are not yet supported by the API.
        These properties will be unaffected when applying the changes, thus preserving any manual changes.
      operationId: set_network_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
        required: true
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readwrite
    patch:
      tags:
      - network
      summary: Modify the network configuration of the device.
      description: |-
        This endpoint modifies the network configuration of the device by applying a JSON merge patch (https://datatracker.ietf.org/doc/html/rfc7396)
        to the current configuration.
        Will return the updated configuration after applying the patch on success.

        Note that some network properties are not yet supported by the API.
        These properties will be unaffected when applying the changes, thus preserving any manual changes.
      operationId: update_network_config
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkConfig'
        required: true
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readwrite
  /network/state:
    get:
      tags:
      - network
      summary: Get the current network state of the device.
      description: This includes properties that can not be configured via the HTTP API, like the current IP addresses and routing table.
      operationId: get_network_state
      responses:
        '200':
          description: Network state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkState'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readonly
      - OAuth2:
        - u-os-adm.network.readwrite
  /openapi.json:
    get:
      tags:
      - openapi
      summary: Get the current API spec
      description: Returns the current OpenAPI specification of the u-OS Admin API. This is useful for clients to discover the API endpoints and their parameters.
      operationId: get_openapi
      responses:
        '200':
          description: OpenAPI specification JSON
          content:
            application/json: {}
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2: []
  /operations/{operation_id}:
    get:
      tags:
      - operations
      summary: Get the status of a long running operation by its ID.
      description: The operation ID can only be retained at the time it is created.
      operationId: get_operation
      parameters:
      - name: operation_id
        in: path
        description: ID of the operation
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status of the long running operation
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource as result of the long running operation. This is only the case when the process has been completed and a resource has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationState'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2: []
  /recovery:factory-reset:
    post:
      tags:
      - recovery
      summary: Triggers a factory reset.
      description: Triggers a factory reset, which erases all user data on the system.
      operationId: recovery_factory_reset
      responses:
        '202':
          description: Factory reset initiated successfully.
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.recovery.readwrite
  /security/config:
    get:
      tags:
      - security
      summary: Get the security configuration for the system.
      description: Get the security configuration for the system.
      operationId: get_security_settings
      responses:
        '200':
          description: Security configuration found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.security.readonly
      - OAuth2:
        - u-os-adm.security.readwrite
    put:
      tags:
      - security
      summary: Set the security configuration for the system.
      description: Set the security configuration for the system.
      operationId: set_security_settings
      requestBody:
        description: Security configuration to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuritySettings'
        required: true
      responses:
        '200':
          description: Security configuration updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecuritySettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.security.readwrite
  /syslog/certificates:
    get:
      tags:
      - syslog
      summary: Get all uploaded certificates.
      description: Returns all certificates organized by type with their content.
      operationId: get_certificates
      responses:
        '200':
          description: Certificate store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readonly
      - OAuth2:
        - u-os-adm.syslog.readwrite
    put:
      tags:
      - syslog
      summary: Set all certificates
      description: |-
        Replaces the entire certificate store. Any previously uploaded
        certificate not included in the request will be deleted.

        To ensure that certificates are unused after deletion, please reboot the device.
        Deleting a currently used certificate results in an invalid syslog configuration.

        **Certificate types:**
        - `server-ca`: CA certificate to verify the syslog server
        - `client-cert`: Client certificate for mTLS authentication
        - `client-key`: Client private key for mTLS authentication
      operationId: set_certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificates'
        required: true
      responses:
        '200':
          description: Certificates applied successfully
        '400':
          description: Invalid certificate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readwrite
    patch:
      tags:
      - syslog
      summary: Partially update certificates
      description: |-
        Applies a patch to the certificate store using JSON Merge Patch semantics:
        - **Absent type**: no changes to that category
        - **Entry with content**: add or overwrite that certificate
        - **Entry set to `null`**: delete that certificate

        To ensure that certificates are unused after deletion, please reboot the device.
        Deleting a currently used certificate results in an invalid syslog configuration.

        Example — add a new server CA and delete an old one:
        ```json
        {
            "server-ca": {
                "new-ca.pem": { "content": "-----BEGIN CERTIFICATE-----\n..." },
                "old-ca.pem": null
            }
        }
        ```
      operationId: patch_certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificatesPatch'
        required: true
      responses:
        '200':
          description: Certificates updated successfully
        '400':
          description: Invalid certificate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readwrite
  /syslog/config:
    get:
      tags:
      - syslog
      summary: Get syslog forwarding configuration.
      description: Returns the current configuration for syslog forwarding.
      operationId: get_config
      responses:
        '200':
          description: Syslog forwarding configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyslogConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readonly
      - OAuth2:
        - u-os-adm.syslog.readwrite
    put:
      tags:
      - syslog
      summary: Set syslog forwarding configuration.
      description: Updates the syslog forwarding configuration with the provided settings.
      operationId: set_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyslogConfig'
        required: true
      responses:
        '200':
          description: Configuration applied successfully
        '400':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readwrite
  /syslog/state:
    get:
      tags:
      - syslog
      summary: Get syslog forwarding service state.
      description: |-
        Returns the runtime status of the syslog forwarding service
        and summary information about the current configuration.
      operationId: get_state
      responses:
        '200':
          description: Syslog forwarding service state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyslogState'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readonly
      - OAuth2:
        - u-os-adm.syslog.readwrite
  /system/disks:
    get:
      tags:
      - system
      summary: This endpoint returns disk information
      description: Returns a list of all storage disks in the system and their respective properties.
      operationId: get_system_disks
      responses:
        '200':
          description: Disk information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disks'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.system.readonly
      - OAuth2:
        - u-os-adm.system.readwrite
  /system/info:
    get:
      tags:
      - system
      summary: This endpoint returns static system information (such as cpu architecture, firmware info, ...)
      description: |-
        Some hardware information can only be read out if the device was booted via uboot.
        Everything that could not be determined is returned as None (these information are marked as optional).
      operationId: get_system_info
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInformation'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.system.readonly
      - OAuth2:
        - u-os-adm.system.readwrite
  /system/nameplate:
    get:
      tags:
      - system
      summary: Returns the digital nameplate information of the device.
      description: Returns nameplate information according to the IDTA digital nameplate specification 3.0.
      operationId: get_system_nameplate
      responses:
        '200':
          description: Nameplate information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceNameplate'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.system.readonly
      - OAuth2:
        - u-os-adm.system.readwrite
  /system:reboot:
    post:
      tags:
      - system
      summary: Triggers a system reboot.
      description: Triggers a reboot. System will be unavailable for a while after triggering this.
      operationId: system_reboot
      responses:
        '202':
          description: System reboot initiated successfully.
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.system.readwrite
  /update/config:
    get:
      tags:
      - update
      summary: Get the update configuration for the system.
      description: The update configuration contains settings related to updating a u-OS device.
      operationId: get_update_settings
      responses:
        '200':
          description: Update configuration found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readonly
      - OAuth2:
        - u-os-adm.update.readwrite
    put:
      tags:
      - update
      summary: Set the update configuration for the system.
      description: |-
        The update configuration contains settings related to updating a u-OS device.
        Updating the configuration will restart the update service to apply new settings.
      operationId: set_update_settings
      requestBody:
        description: Update configuration to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettings'
        required: true
      responses:
        '200':
          description: Update configuration updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readwrite
    patch:
      tags:
      - update
      summary: Modify the update configuration of the device.
      description: |-
        This endpoint modifies the update configuration of the device by applying a JSON merge patch (<https://datatracker.ietf.org/doc/html/rfc7396>)
        to the current configuration.
        Will return the updated configuration after applying the patch on success.
      operationId: update_update_settings
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PartialUpdateSettings'
        required: true
      responses:
        '200':
          description: The updated configuration after applying the merge patch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readwrite
components:
  schemas:
    AddressInformation:
      type: object
      description: Contains the address information of the device. Part of the device nameplate.
      required:
      - Street
      - Zipcode
      - CityTown
      - NationalCode
      properties:
        CityTown:
          type: string
        NationalCode:
          type: string
        Street:
          type: string
        Zipcode:
          type: string
    CertificateEntry:
      type: object
      description: A single certificate entry.
      required:
      - content
      properties:
        content:
          type: string
          description: PEM-encoded certificate or key content.
    Certificates:
      type: object
      description: |-
        All certificates organized by type.

        Each certificate type maps certificate names (keys) to their entries.
      required:
      - server_ca
      - client_cert
      - client_key
      properties:
        client_cert:
          type: object
          description: Client certificates for mutual TLS authentication.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        client_key:
          type: object
          description: Client private keys for mutual TLS authentication.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        server_ca:
          type: object
          description: CA certificates for verifying the syslog server's identity.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
      example:
        client_cert:
          device.pem:
            content: |-
              -----BEGIN CERTIFICATE-----
              ...
              -----END CERTIFICATE-----
        client_key:
          device-key.pem:
            content: M15UP3RS5CR3T
        server_ca:
          my-ca.pem:
            content: |-
              -----BEGIN CERTIFICATE-----
              ...
              -----END CERTIFICATE-----
    CertificatesPatch:
      type: object
      description: |-
        Patch body for partial certificate updates (JSON Merge Patch semantics).

        - Absent type: no changes to that certificate type.
        - Present type with entries:
          - `"name": { "content": "..." }` → add or overwrite certificate
          - `"name": null` → delete certificate
      properties:
        client_cert:
          type:
          - object
          - 'null'
          description: |-
            Changes to client certificates.
            Map entries with value `null` will be deleted.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        client_key:
          type:
          - object
          - 'null'
          description: |-
            Changes to client private keys.
            Map entries with value `null` will be deleted.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        server_ca:
          type:
          - object
          - 'null'
          description: |-
            Changes to server CA certificates.
            Map entries with value `null` will be deleted.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
    CreateLogReportResponse:
      type: object
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
    DeviceNameplate:
      type: object
      description: |-
        Contains the device nameplate information.

        Based on [IDTA 02006-3-0 Digital Nameplate for industrial equipment specification](https://github.com/admin-shell-io/submodel-templates/tree/main/published/Digital%20nameplate/3/0)
      required:
      - URIOfTheProduct
      - ManufacturerName
      - ManufacturerProductDesignation
      - AddressInformation
      - OrderCodeOfManufacturer
      properties:
        AddressInformation:
          $ref: '#/components/schemas/AddressInformation'
        HardwareVersion:
          type:
          - string
          - 'null'
        ManufacturerName:
          type: string
        ManufacturerProductDesignation:
          type: string
        ManufacturerProductType:
          type:
          - string
          - 'null'
        OrderCodeOfManufacturer:
          type: string
        SerialNumber:
          type:
          - string
          - 'null'
        SoftwareVersion:
          type:
          - string
          - 'null'
        URIOfTheProduct:
          type: string
        YearOfConstruction:
          type:
          - string
          - 'null'
    Disk:
      type: object
      required:
      - device_path
      - mount_points
      - file_system
      - total_size
      - free_size
      - storage_type
      properties:
        device_path:
          type: string
        file_system:
          type: string
        free_size:
          type: integer
          format: int64
          minimum: 0
        mount_points:
          type: array
          items:
            type: string
        storage_type:
          $ref: '#/components/schemas/StorageType'
        total_size:
          type: integer
          format: int64
          minimum: 0
    Disks:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disk'
    Firmware:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
        version:
          type: string
    GlobalDnsServers:
      type: object
      description: |-
        Represents the global DNS servers used by the system.

        The order of the servers represents their priority, with the first one being the primary DNS server unless an interface overrides it.
      required:
      - servers
      - searches
      properties:
        searches:
          type: array
          items:
            type: string
          example:
          - .
        servers:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
    GpgKey:
      type: object
      description: The content of a GPG public key file in ASCII armor format.
      required:
      - content
      properties:
        content:
          type: string
          description: 'Hint: Newlines are forbidden in JSON strings, so you need to escape them.'
          example: |-
            -----BEGIN PGP PUBLIC KEY BLOCK-----

            ...
            -----END PGP PUBLIC KEY BLOCK-----
    HttpErrorPayload:
      type: object
      description: |-
        Common error payload structure for HTTP responses.

        Based on [RFC 9457](https://datatracker.ietf.org/doc/html/rfc9457)
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Optional details about the error
          example: 'Low Level OS Error #1234'
        instance:
          type:
          - string
          - 'null'
          format: uri-reference
          description: A human-readable explanation specific to this occurrence of the problem
          example: null
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 500
          maximum: 599
          minimum: 100
        title:
          type: string
          description: Human-readable error message.
          example: Something went wrong in the backend.
        type:
          type: string
          format: uri-reference
          description: |-
            A URI reference that identifies the problem type

            The last part of the URI is always a `ErrorId`
          example: /u-os-adm/api/v1/errors/set-security-settings
    InterfaceConfig:
      type: object
      description: Represents the configuration of a single network interface, used for putting.
      required:
      - ipv4_config
      properties:
        enabled:
          type: boolean
        ipv4_config:
          $ref: '#/components/schemas/Ipv4Config'
    InterfaceState:
      type: object
      description: Represents the current state of a network interface.
      required:
      - type
      - ipv4
      properties:
        ipv4:
          $ref: '#/components/schemas/Ipv4State'
        type:
          $ref: '#/components/schemas/InterfaceType'
    InterfaceType:
      type: string
      description: The type of network interface.
      enum:
      - ETHERNET
      - USB
    Ipv4Config:
      type: object
      description: Represents the IPv4 configuration of a network interface, used for putting.
      required:
      - dhcp
      - addresses
      - gateway
      - dns
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
        dhcp:
          type: boolean
        dns:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
        gateway:
          oneOf:
          - type: 'null'
          - type: string
            format: ipv4
            description: Represents an IPv4 address in a string format.
    Ipv4PrefixLength:
      type: integer
      format: int32
      examples:
      - '24'
      maximum: 32
      minimum: 0
    Ipv4Route:
      type: object
      description: An IP route entry in the IPv4 routing table.
      required:
      - destination
      - gateway
      - interface
      - metric
      properties:
        destination:
          $ref: '#/components/schemas/Ipv4Subnet'
        gateway:
          $ref: '#/components/schemas/Ipv4String'
        interface:
          type: string
          example: eth-x4
        metric:
          type: integer
          format: int32
          example: 103
          minimum: 0
    Ipv4State:
      type: object
      description: Represents the IPv4 state of a network interface.
      required:
      - activated
      properties:
        activated:
          type: boolean
          description: Activated is true when the connection is active and a cable is plugged in. Otherwise false.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
    Ipv4String:
      type: string
      format: ipv4
      description: Represents an IPv4 address in a string format.
    Ipv4Subnet:
      type: object
      description: |-
        Ipv4 address with prefix length.

        The prefix length is used to determine the network mask.
      required:
      - ip
      - prefix_length
      properties:
        ip:
          $ref: '#/components/schemas/Ipv4String'
        prefix_length:
          $ref: '#/components/schemas/Ipv4PrefixLength'
    LogEntry:
      type: object
      required:
      - timestamp
      - message
      - source
      properties:
        message:
          type: string
          example: Log message
        source:
          $ref: '#/components/schemas/LogSource'
        timestamp:
          type: string
          format: date-time
    LogEntryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_cursor:
          type:
          - string
          - 'null'
    LogSource:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: u-os-adm
    LogSourcesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogSource'
    Memory:
      type: object
      required:
      - total_size
      - available_size
      properties:
        available_size:
          type: integer
          format: int64
          minimum: 0
        total_size:
          type: integer
          format: int64
          minimum: 0
    NetworkConfig:
      type: object
      description: Used for writing the network configuration. All fields are required to be present, but can be empty in some cases.
      required:
      - hostname
      - interfaces
      properties:
        hostname:
          type: string
          format: hostname
          example: wm-uc20-m3000
          maxLength: 63
          minLength: 1
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InterfaceConfig'
          propertyNames:
            type: string
          example:
            eth-x4:
              enabled: true
              ipv4_config:
                addresses:
                - ip: 192.168.1.102
                  prefix_length: 24
                dhcp: false
                dns:
                - 8.8.8.8
                gateway: 192.168.1.1
            eth-x5:
              enabled: false
              ipv4_config:
                addresses: []
                dhcp: true
                dns: []
                gateway: null
        service_interface:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ServiceInterfaceConfig'
    NetworkState:
      type: object
      description: |-
        The current network state on the device.

        Note that this may differ from the configuration, e.g. a DHCP interface has an address in the state, but not in the configuration.
      required:
      - dns_resolver
      - routes
      - interfaces
      properties:
        dns_resolver:
          $ref: '#/components/schemas/GlobalDnsServers'
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InterfaceState'
          propertyNames:
            type: string
          example:
            eth-x4:
              ipv4:
                activated: true
                addresses:
                - ip: 192.168.1.100
                  prefix_length: 24
              type: ETHERNET
            eth-x5:
              ipv4:
                activated: true
                addresses:
                - ip: 192.168.1.101
                  prefix_length: 24
              type: ETHERNET
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Route'
    OperationState:
      oneOf:
      - $ref: '#/components/schemas/OperationStatePending'
      - $ref: '#/components/schemas/OperationStateCompleted'
      - $ref: '#/components/schemas/OperationStateFailed'
      description: Represents the entire state of a long-running operation.
    OperationStateCompleted:
      type: object
      required:
      - status
      - created_at
      - completed_at
      properties:
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        resource_id:
          type: string
        resource_url:
          type: string
          format: url
        status:
          type: string
          enum:
          - COMPLETED
    OperationStateFailed:
      type: object
      required:
      - status
      - created_at
      - failed_at
      properties:
        created_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        resource_url:
          type: string
          format: url
        status:
          type: string
          enum:
          - FAILED
    OperationStatePending:
      type: object
      required:
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
    OutputReachability:
      type: string
      description: Reachability status of a syslog output destination.
      enum:
      - CONNECTED
      - ERROR
      - PENDING
    OutputState:
      type: object
      description: Health information for a single syslog output.
      required:
      - reachable
      properties:
        reachable:
          $ref: '#/components/schemas/OutputReachability'
          description: |-
            Reachability status of the output destination.

            - `connected` — The output has successfully sent its most recent batch of logs.
            - `error` — The output is experiencing delivery failures and is currently retrying.
            - `pending` — Reachability cannot be determined yet, because no logs have been
              attempted to be sent so far (e.g. just started or filter-config filtered out all logs).
    PartialRecipeSigning:
      type: object
      properties:
        enabled:
          type: boolean
          description: |-
            True if removable media update signing is enabled, false otherwise.

            If enabled, the recipe file of the removable media update must be signed with a GPG key that
            is added to the `user_gpg_keys` list in order to be accepted by the system.

            Note: Removable media update signing is always disabled before initial setup is complete.
        user_gpg_keys:
          type: object
          description: User specific GPG public keys that are used to verify removable media updates.
          additionalProperties: true
          example:
            another-gpg-key:
              content: |-
                -----BEGIN PGP PUBLIC KEY BLOCK-----

                ...
                -----END PGP PUBLIC KEY BLOCK-----
            delete-me: null
    PartialUpdateSettings:
      type: object
      description: Represents the update configuration for the system used in patch.
      properties:
        removable_media_update:
          type: object
          properties:
            enabled:
              type: boolean
              description: |-
                True if removable media updates are enabled, false otherwise.

                Note: Removable media updates are always enabled before initial setup is complete.
                This value shows only the state after the initial setup.
            recipe_signing:
              $ref: '#/components/schemas/PartialRecipeSigning'
              description: Settings related to signing of removable media updates.
        signed_update:
          type: object
          properties:
            enabled:
              type: boolean
              description: True if signed updates are enabled, false otherwise.
            preinstalled_gpg_keys:
              oneOf:
              - type: object
                properties:
                  enabled:
                    type: boolean
                    description: |-
                      True if Preinstalled GPG keys are enabled, false otherwise.

                      All devices come with preinstalled preinstalled GPG keys to verify updates.
                      If this is set to false, those keys will be ignored during update verification.
                      User must upload their own GPG keys to verify updates in this case.
              description: |-
                Can be used to enable or disable preinstalled Preinstalled GPG keys.
                This can be useful e.g. to only allow custom, self signed updates to the device.
            user_gpg_keys:
              type: object
              additionalProperties: true
              example:
                another-gpg-key:
                  content: |-
                    -----BEGIN PGP PUBLIC KEY BLOCK-----

                    ...
                    -----END PGP PUBLIC KEY BLOCK-----
                delete-me: null
    RecipeSigning:
      type: object
      required:
      - enabled
      - user_gpg_keys
      properties:
        enabled:
          type: boolean
          description: |-
            True if removable media update signing is enabled, false otherwise.

            If enabled, the recipe file of the removable media update must be signed with a GPG key that
            is added to the `user_gpg_keys` list in order to be accepted by the system.

            Note: Removable media update signing is always disabled before initial setup is complete.
        user_gpg_keys:
          type: object
          description: User specific GPG public keys that are used to verify removable media updates.
          additionalProperties:
            $ref: '#/components/schemas/GpgKey'
          propertyNames:
            type: string
            description: A GPG key ID that acts as a unique identifier for the key
            examples:
            - custom-gpg-key
            maxLength: 255
            minLength: 1
            pattern: ^[a-z][a-z\-0-9]*$
          example:
            another-gpg-key:
              content: |-
                -----BEGIN PGP PUBLIC KEY BLOCK-----

                ...
                -----END PGP PUBLIC KEY BLOCK-----
    SecuritySettings:
      type: object
      required:
      - root_access
      properties:
        root_access:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
    ServerCa:
      oneOf:
      - $ref: '#/components/schemas/ServerCaVerify'
      - $ref: '#/components/schemas/ServerCaVerifyWithCa'
      - $ref: '#/components/schemas/ServerCaNoVerify'
      description: Server certificate verification configuration.
    ServerCaNoVerify:
      type: object
      description: Do not verify the server's certificate (insecure, use only for testing).
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - NO_VERIFY
    ServerCaVerify:
      type: object
      description: Verify the server's certificate using the system's CA certificate store.
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - VERIFY
    ServerCaVerifyWithCa:
      type: object
      description: |-
        Verify the server's certificate using a custom CA certificate.
        The CA certificate must be uploaded via PUT /syslog/certificates.
      required:
      - mode
      - ca
      properties:
        ca:
          type: string
          description: Name of the CA certificate file.
          example: my-corp-ca.pem
        mode:
          type: string
          enum:
          - VERIFY_WITH_CA
    ServiceInterfaceConfig:
      type: object
      description: Represents the configuration of the service interface, used for putting.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    ServiceStatus:
      type: string
      description: Systemd service status.
      enum:
      - ACTIVE
      - INACTIVE
      - FAILED
      - ACTIVATING
      - DEACTIVATING
      - UNKNOWN
    StorageType:
      type: string
      enum:
      - Internal
      - Removable
    SyslogConfig:
      type: object
      description: Main configuration for syslog forwarding.
      required:
      - enabled
      - outputs
      properties:
        enabled:
          type: boolean
          description: Whether syslog forwarding is enabled. If false, the service is stopped.
        outputs:
          type: object
          description: |-
            Map of output name to output configuration.
            Output names must be 1-32 characters, containing only lowercase letters, numbers, and hyphens.
            Cannot start or end with a hyphen.
          additionalProperties:
            $ref: '#/components/schemas/SyslogOutputConfig'
          propertyNames:
            type: string
          example:
            my-log-server:
              destination:
                format: RFC5424
                host: 192.168.1.123
                port: 6514
                tls:
                  mode: ENABLED
                  server_ca:
                    ca: my-corp-ca.pem
                    mode: VERIFY_WITH_CA
                transport: TCP
              filter:
                facilities:
                - AUTH
                identifiers:
                - sudo
                - kernel
                levels:
                - ERR
                - WARNING
                units:
                - nginx.service
    SyslogDestination:
      type: object
      description: Destination server configuration.
      required:
      - host
      - port
      - transport
      - tls
      - format
      properties:
        format:
          $ref: '#/components/schemas/SyslogFormat'
          description: Syslog message format.
        host:
          type: string
          description: Server hostname or IP address.
          example: 192.168.1.100
        port:
          type: integer
          format: int32
          description: Server port number (514 for plain syslog, 6514 for TLS is common).
          example: 6514
          minimum: 0
        tls:
          $ref: '#/components/schemas/TlsConfig'
          description: TLS configuration. Determines whether TLS encryption is used (TCP only).
        transport:
          $ref: '#/components/schemas/Transport'
          description: 'Transport protocol: TCP or UDP.'
    SyslogFacility:
      type: string
      description: Standard syslog facilities as defined in RFC 5424.
      enum:
      - KERN
      - USER
      - MAIL
      - DAEMON
      - AUTH
      - SYSLOG
      - LPR
      - NEWS
      - UUCP
      - CRON
      - AUTHPRIV
      - FTP
      - NTP
      - AUDIT
      - ALERT
      - CLOCK
      - LOCAL0
      - LOCAL1
      - LOCAL2
      - LOCAL3
      - LOCAL4
      - LOCAL5
      - LOCAL6
      - LOCAL7
    SyslogFilter:
      type: object
      description: |-
        Syslog filter criteria.

        Filtering uses systemd journal's native logic:
        - Within a field: values are OR'd (e.g., level=err OR level=warning)
        - Across fields: conditions are AND'd (e.g., level=err AND facility=auth)
        - Empty fields match everything
      required:
      - levels
      - facilities
      - units
      - identifiers
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/SyslogFacility'
          description: |-
            Syslog facilities to include. Standard RFC 5424 facility codes.
            If empty, logs from all facilities are included.
            Your services can use local0-local7 for custom categorization.
        identifiers:
          type: array
          items:
            type: string
          description: |-
            Specific `SYSLOG_IDENTIFIER` values to include (e.g. 'kernel').

            Each identifier must:
            - Be at most 128 characters
            - Contain only: ASCII letters (a-z, A-Z), digits (0-9), '-', '_', '.'
            - Not be empty

            If empty, logs from all identifiers are included.
          example:
          - sudo
          - kernel
        levels:
          type: array
          items:
            $ref: '#/components/schemas/SyslogLevel'
          description: |-
            Log severity levels to include. Only logs with these exact levels are forwarded.
            If empty, logs of all severity levels are included.
        units:
          type: array
          items:
            type: string
          description: |-
            Specific systemd units to include.

            Each unit name must:
            - Be at most 255 characters
            - Contain only: ASCII letters (a-z, A-Z), digits (0-9), ':', '-', '_', '.', '@'
            - End with a valid unit suffix: .service, .socket, .device, .mount,
              .automount, .swap, .target, .path, .timer, .slice, or .scope

            Examples: "nginx.service", "sshd.socket", "user@1000.service"

            If empty, logs from all units are included.
          example:
          - nginx.service
          - fluent-bit.service
    SyslogFormat:
      type: string
      description: Syslog message format standard.
      enum:
      - RFC5424
      - RFC3164
    SyslogLevel:
      type: string
      description: Syslog severity levels as defined in RFC 5424.
      enum:
      - EMERG
      - ALERT
      - CRIT
      - ERR
      - WARNING
      - NOTICE
      - INFO
      - DEBUG
    SyslogOutputConfig:
      type: object
      description: |-
        A single syslog output destination with its filter criteria.
        The output name (map key) must be 1-32 characters, containing only lowercase letters,
        numbers, and hyphens. Cannot start or end with a hyphen.
      required:
      - destination
      - filter
      properties:
        destination:
          $ref: '#/components/schemas/SyslogDestination'
          description: The destination server configuration.
        filter:
          $ref: '#/components/schemas/SyslogFilter'
          description: Filter criteria - which logs to send to this output.
    SyslogState:
      type: object
      description: Runtime state of the syslog forwarding service.
      required:
      - status
      properties:
        outputs:
          type: object
          description: |-
            Per-output health information.
            Only populated when the service is active and the monitoring API is reachable.
          additionalProperties:
            $ref: '#/components/schemas/OutputState'
          propertyNames:
            type: string
        status:
          $ref: '#/components/schemas/ServiceStatus'
          description: Current service status from systemd.
      example:
        outputs:
          audit-logs:
            reachable: CONNECTED
          kernel-logs:
            reachable: ERROR
          my-app-logs:
            reachable: PENDING
        status: ACTIVE
    SystemInformation:
      type: object
      required:
      - cpu_architecture
      - firmware
      - memory
      properties:
        cpu_architecture:
          type: string
        firmware:
          $ref: '#/components/schemas/Firmware'
        memory:
          $ref: '#/components/schemas/Memory'
    TlsConfig:
      oneOf:
      - $ref: '#/components/schemas/TlsDisabled'
      - $ref: '#/components/schemas/TlsEnabled'
      - $ref: '#/components/schemas/TlsEnabledWithMtls'
      description: |-
        TLS configuration for encrypted syslog transport.
        Certificates are managed separately via the certificates endpoint.
    TlsDisabled:
      type: object
      description: TLS is disabled (plain-text transport).
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - DISABLED
    TlsEnabled:
      type: object
      description: TLS is enabled with the given settings.
      required:
      - mode
      - server_ca
      properties:
        mode:
          type: string
          enum:
          - ENABLED
        server_ca:
          $ref: '#/components/schemas/ServerCa'
          description: Server certificate verification mode.
    TlsEnabledWithMtls:
      type: object
      required:
      - mode
      - server_ca
      - client_cert
      - client_key
      properties:
        client_cert:
          type: string
          description: |-
            Name of the client certificate file.
            Must be uploaded via the certificates endpoint.
          example: device.pem
        client_key:
          type: string
          description: |-
            Name of the client private key file.
            Must be uploaded via the certificates endpoint.
          example: device-key.pem
        mode:
          type: string
          enum:
          - ENABLED_WITH_MTLS
        server_ca:
          $ref: '#/components/schemas/ServerCa'
    Transport:
      type: string
      description: Transport protocol for syslog. TLS is configured separately.
      enum:
      - TCP
      - UDP
    UpdateInterfaceConfig:
      type: object
      description: Represents the configuration of a single network interface, used for patching.
      required:
      - ipv4_config
      properties:
        enabled:
          type: boolean
        ipv4_config:
          $ref: '#/components/schemas/UpdateIpv4Config'
    UpdateIpv4Config:
      type: object
      description: Represents the IPv4 configuration of a network interface, used for patching.
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
        dhcp:
          type: boolean
        dns:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
        gateway:
          oneOf:
          - type: 'null'
          - type: string
            format: ipv4
            description: Represents an IPv4 address in a string format.
    UpdateNetworkConfig:
      type: object
      description: Allows partial updates to the network configuration via patch requests.
      properties:
        hostname:
          type: string
          format: hostname
          example: wm-uc20-m3000
          maxLength: 63
          minLength: 1
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UpdateInterfaceConfig'
          propertyNames:
            type: string
          example:
            eth-x4:
              ipv4_config:
                dhcp: false
                gateway: null
            eth-x5:
              enabled: true
              ipv4_config:
                dhcp: true
        service_interface:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UpdateServiceInterfaceConfig'
    UpdateServiceInterfaceConfig:
      type: object
      description: Represents the configuration of the service network interface, used for patching.
      properties:
        enabled:
          type: boolean
    UpdateSettings:
      type: object
      description: Represents the update configuration for the system used in get and put.
      required:
      - signed_update
      properties:
        removable_media_update:
          type: object
          required:
          - enabled
          - recipe_signing
          properties:
            enabled:
              type: boolean
              description: |-
                True if removable media updates are enabled, false otherwise.

                Note: Removable media updates are always enabled before initial setup is complete.
                This value shows only the state after the initial setup.
            recipe_signing:
              $ref: '#/components/schemas/RecipeSigning'
              description: Settings related to signing of removable media updates.
        signed_update:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              description: True if signed updates are enabled, false otherwise.
            preinstalled_gpg_keys:
              oneOf:
              - type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
                    description: |-
                      True if Preinstalled GPG keys are enabled, false otherwise.

                      All devices come with preinstalled preinstalled GPG keys to verify updates.
                      If this is set to false, those keys will be ignored during update verification.
                      User must upload their own GPG keys to verify updates in this case.
              description: |-
                Can be used to enable or disable preinstalled Preinstalled GPG keys.
                This can be useful e.g. to only allow custom, self signed updates to the device.
            user_gpg_keys:
              type: object
              description: User specific GPG public keys that are used to verify software updates.
              additionalProperties:
                $ref: '#/components/schemas/GpgKey'
              propertyNames:
                type: string
                description: A GPG key ID that acts as a unique identifier for the key
                examples:
                - custom-gpg-key
                maxLength: 255
                minLength: 1
                pattern: ^[a-z][a-z\-0-9]*$
              example:
                another-gpg-key:
                  content: |-
                    -----BEGIN PGP PUBLIC KEY BLOCK-----

                    ...
                    -----END PGP PUBLIC KEY BLOCK-----
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            u-os-adm.logging.readonly: Read access for logging endpoints
            u-os-adm.network.readonly: Read access for network endpoints
            u-os-adm.network.readwrite: Read and write access for network endpoints
            u-os-adm.recovery.readwrite: Read and write access for recovery endpoints
            u-os-adm.security.readonly: Read access for security endpoints
            u-os-adm.security.readwrite: Read and write access for security endpoints
            u-os-adm.syslog.readonly: Read access for syslog endpoints
            u-os-adm.syslog.readwrite: Read and write access for syslog endpoints
            u-os-adm.system.readonly: Read access for system endpoints
            u-os-adm.system.readwrite: Read and write access for system endpoints
            u-os-adm.update.readonly: Read access for update endpoints
            u-os-adm.update.readwrite: Read and write access for update endpoints
      description: The HTTP API uses the OAuth2 client credentials flow.
tags:
- name: logging
  description: Centralized system logging, capture and reporting API for u-OS
- name: syslog
  description: API for syslog forwarding configuration
- name: network
  description: API for network settings and state of u-OS
- name: openapi
  description: API for reading the OpenAPI specification
- name: operations
  description: API for u-OS long running operations
- name: recovery
  description: API for recovery of u-OS
- name: security
  description: API for u-OS security settings
- name: system
  description: API for general system informations & actions of u-OS
- name: update
  description: API for u-OS update settings
