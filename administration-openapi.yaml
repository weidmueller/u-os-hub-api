              pattern: ^(?:\*|[A-Za-z0-9_.][A-Za-z0-9_.-]{0,14}\*?)$
    InputRule:
      type: object
      required:
      - description
      - priority
      - match
      - action
      properties:
        action:
          $ref: '#/components/schemas/RuleAction'
        description:
