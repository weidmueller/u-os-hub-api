            enum:
            - ANY
            - TCP
            - UDP
            - ICMP
          source:
            type: array
            items:
              type: string
              description: |-
                IPv4 address, CIDR subnet, or address range. Accepts 'A.B.C.D', 'A.B.C.D/N',
                or 'A.B.C.D-A.B.C.D'.
          sport:
            type: array
            items:
              type: string
              description: TCP/UDP port (0..=65535) or inclusive port range. Accepts 'PORT' or 'START-END'.
      - type: object
        required:
        - out_interface
        properties:
          out_interface:
            type: array
            items:
              type: string
              description: Name of an Ethernet interface or wildcard. Limited to 1..=15 visible characters with an optional trailing '*' wildcard, or a bare '*'.
              pattern: ^(?:\*|[A-Za-z0-9_.][A-Za-z0-9_.-]{0,14}\*?)$
    OutputReachability:
      type: string
      description: Reachability status of a syslog output destination.
      enum:
      - CONNECTED
      - ERROR
      - PENDING
    OutputRule:
      type: object
      required:
      - description
      - priority
      - match
      - action
      properties:
        action:
          $ref: '#/components/schemas/RuleAction'
        description:
          type: string
          description: Human-readable comment for a firewall rule. The value is restricted to printable ASCII without quotes or backslashes.
          pattern: ^[ -!#-\[\]-~]{0,128}$
        match:
          $ref: '#/components/schemas/OutboundMatch'
        priority:
          type: integer
          format: int32
          description: Sort order of the rule. Lower values are evaluated first.
          minimum: 0
    OutputState:
      type: object
      description: Health information for a single syslog output.
      required:
      - reachable
      properties:
        reachable:
          $ref: '#/components/schemas/OutputReachability'
          description: |-
            Reachability status of the output destination.

            - `connected` — The output has successfully sent its most recent batch of logs.
            - `error` — The output is experiencing delivery failures and is currently retrying.
            - `pending` — Reachability cannot be determined yet, because no logs have been
              attempted to be sent so far (e.g. just started or filter-config filtered out all logs).
    PartialCertificates:
      type: object
      description: |-
        All certificates organized by type.

         Each certificate type maps certificate names (keys) to their entries. (PATCH)
      properties:
        client_cert:
          type: object
          description: Client certificates for mutual TLS authentication.
          additionalProperties: true
        client_key:
          type: object
          description: Client private keys for mutual TLS authentication.
          additionalProperties: true
        server_ca:
          type: object
          description: CA certificates for verifying the syslog server's identity.
          additionalProperties: true
    PartialDhcpIpv4Range:
      type: object
      description: Represents a range of IPv4 addresses (PATCH)
      properties:
        end:
          $ref: '#/components/schemas/Ipv4String'
          description: End of the range (inclusive)
        start:
          $ref: '#/components/schemas/Ipv4String'
          description: Start of the range (inclusive)
    PartialFailoverGlobalConfig:
      type: object
      description: |-
        Global failover configuration.

         Controls the probe loop that monitors all configured interfaces and adjusts
         their route metrics based on connectivity probe results. (PATCH)
      properties:
        failure_threshold:
          type: integer
          format: int32
          description: Number of consecutive failed probes before an interface is considered failed and penalised.
          example: 3
          minimum: 1
        probe_interval_seconds:
          type: integer
          format: int64
          description: Interval between failover probes in seconds.
          example: 10
          minimum: 1
        success_threshold:
          type: integer
          format: int32
          description: Number of consecutive successful probes before an interface is considered healthy and unpenalised.
          example: 3
          minimum: 1
    PartialFailoverInterfaceConfig:
      type: object
      description: |-
        Failover configuration for a single monitored interface.

         When enabled, the probe loop checks connectivity on this interface. If
         `failure_threshold` consecutive probes fail the interface is penalised by
         settings its active metric to `failed_metric`. Once `success_threshold`
         consecutive probes succeed the metric is restored to the interface's
         configured `metric` value. (PATCH)
      properties:
        enabled:
          type: boolean
          description: Whether failover probing is enabled for this interface.
        failed_metric:
          type: integer
          format: int32
          description: |-
            Network interface metric (priority) that is applied when the interface has failed probing.
            Should be higher than all normal interface metrics to ensure traffic is routed through healthy interfaces.
          example: 20000
          maximum: 2147483647
          minimum: 1
        probe_target:
          $ref: '#/components/schemas/ProbeTarget'
          description: Probe target for connectivity checks (IPv4 address or hostname, optionally with port e.g. "1.1.1.1:5000").
    PartialFilterRules:
      type: object
      properties:
        forward:
          type: object
          additionalProperties: true
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        policy:
          type: object
          additionalProperties: true
    PartialFirewallConfig:
      type: object
      description: |-
        Custom firewall configuration. Contains filter and nat rules.

         If an array is empty, it means "match all".
         For example, an `InputRule` with an empty `source` matches packets from any source address.

         Connections in the established or related conntrack state are accepted automatically. Therefore, no explicit rules are required for the return path. (PATCH)
      properties:
        filter:
          $ref: '#/components/schemas/PartialFilterRules'
        nat:
          $ref: '#/components/schemas/PartialNatRules'
    PartialInterfaceConfig:
      type: object
      description: Represents the configuration of a single network interface. (PATCH)
      properties:
        enabled:
          type: boolean
        ipv4_config:
          $ref: '#/components/schemas/PartialIpv4Config'
    PartialIpv4Config:
      type: object
      description: Represents the IPv4 configuration of a network interface. (PATCH)
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4Subnet'
        dhcp:
          type: boolean
        dns:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
        failover:
          $ref: '#/components/schemas/PartialFailoverInterfaceConfig'
        gateway:
          oneOf:
          - type: 'null'
          - type: string
            format: ipv4
            description: Represents an IPv4 address in a string format.
        metric:
          type: integer
          format: int64
          description: |-
            Normal route metric (priority) for this interface. Lower values have higher priority.
            If a value of -1 is specified, the system will choose the metric automatically.

            If failover is enabled, the actual metric of the interface is
            dynamic and may change between metric and `failed_metric` depending on the probe state.
          example: 100
          maximum: 2147483647
          minimum: -1
        shared_mode:
          $ref: '#/components/schemas/PartialSharedModeConfig'
    PartialNatRules:
      type: object
      properties:
        postrouting:
          type: object
          description: Postrouting masquerade and snat rules
          additionalProperties: true
        prerouting:
          type: object
          description: Prerouting DNAT rules
          additionalProperties: true
    PartialNetworkConfig:
      type: object
      description: Used for writing the network configuration. All fields are required to be present, but can be empty in some cases. (PATCH)
      properties:
        failover:
          $ref: '#/components/schemas/PartialFailoverGlobalConfig'
          description: Global failover probe settings.
        hostname:
          type: string
          format: hostname
          example: wm-uc20-m3000
          maxLength: 63
          minLength: 1
        interfaces:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PartialInterfaceConfig'
          propertyNames:
            type: string
          example:
            eth-x4:
              ipv4_config:
                dhcp: false
                gateway: null
                shared_mode:
                  enabled: true
            eth-x5:
              enabled: true
              ipv4_config:
                dhcp: true
        service_interface:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PartialServiceInterfaceConfig'
    PartialRecipeSigning:
      type: object
      properties:
        enabled:
          type: boolean
          description: |-
            True if removable media update signing is enabled, false otherwise.

            If enabled, the recipe file of the removable media update must be signed with a GPG key that
            is added to the `user_gpg_keys` list in order to be accepted by the system.

            Note: Removable media update signing is always disabled before initial setup is complete.
        user_gpg_keys:
          type: object
          description: User specific GPG public keys that are used to verify removable media updates.
          additionalProperties: true
          example:
            another-gpg-key:
              content: |-
                -----BEGIN PGP PUBLIC KEY BLOCK-----

                ...
                -----END PGP PUBLIC KEY BLOCK-----
            delete-me: null
    PartialServiceInterfaceConfig:
      type: object
      description: Represents the configuration of the service interface. (PATCH)
      properties:
        enabled:
          type: boolean
    PartialSharedModeConfig:
      type: object
      description: Configuration options for interface sharing (PATCH)
      properties:
        dhcp_ip_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PartialDhcpIpv4Range'
            description: |-
              Configure the DHCP server IP range.

              The IP range must be in the same subnet as the server address, otherwise an error will be returned.
              If not set, an IP range adjacent to the server address will be used.
              Should not contain network address or broadcast address.
        dhcp_lease_time_sec:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Configure the DHCP server lease time in seconds.

            Allowed values:

            - 0 or empty: Default lease time (1h)
            - 2147483647 (max int32): Infinite lease time
            - 120-31536000: Valid range between 2 minutes and 1 year
          minimum: 0
        enabled:
          type: boolean
          description: |-
            If enabled, this device acts as a mini router and may provide internet access to other devices connected to it.
            This includes enabling a DHCP server on the device, which will assign IP addresses to connected devices, as well as hosting a DNS server.
            Traffic will be forwarded through the outbound interface with the highest priority (lowest route metric).

            If enabled, all other properties of the interface are ignored, except for the first IP address in the addresses list,
            which is used as the server address for the DHCP server.
    PartialUpdateSettings:
      type: object
      description: Represents the update configuration for the system used in get and put. (PATCH)
      properties:
        removable_media_update:
          type: object
          properties:
            enabled:
              type: boolean
              description: |-
                True if removable media updates are enabled, false otherwise.

                Note: Removable media updates are always enabled before initial setup is complete.
                This value shows only the state after the initial setup.
            recipe_signing:
              $ref: '#/components/schemas/PartialRecipeSigning'
              description: Settings related to signing of removable media updates.
        signed_update:
          type: object
          properties:
            enabled:
              type: boolean
              description: True if signed updates are enabled, false otherwise.
            preinstalled_gpg_keys:
              oneOf:
              - type: object
                properties:
                  enabled:
                    type: boolean
                    description: |-
                      True if Preinstalled GPG keys are enabled, false otherwise.

                      All devices come with preinstalled preinstalled GPG keys to verify updates.
                      If this is set to false, those keys will be ignored during update verification.
                      User must upload their own GPG keys to verify updates in this case.
              description: |-
                Can be used to enable or disable preinstalled Preinstalled GPG keys.
                This can be useful e.g. to only allow custom, self signed updates to the device.
            user_gpg_keys:
              type: object
              description: User specific GPG public keys that are used to verify software updates.
              additionalProperties: true
              example:
                another-gpg-key:
                  content: |-
                    -----BEGIN PGP PUBLIC KEY BLOCK-----

                    ...
                    -----END PGP PUBLIC KEY BLOCK-----
                delete-me: null
    PolicyType:
      type: string
      description: |-
        `OSDefault` - All custom firewall rules will be ignored! Uses the default policy and firewall rules of u-OS.
        Currently, this means input=Accept, output=Accept, forward=Drop but this may change in the future.

        `Accept` - By default, all packets are accepted by the firewall. If packets should be blocked, rules with DROP action need to be explicitly added.
        Allows to build a 'Block List' by adding new firewall filter rules.

        `Drop` - By default, the firewall blocks all packets, unless there is an explicit rule added that allows the packet.
        Allows to build an 'Allow List' by adding new firewall filter rules. Be careful, this may lock you out of your system unless you add an explicit allow rule!
      enum:
      - DROP
      - ACCEPT
      - OS_DEFAULT
    PostroutingAction:
      oneOf:
      - $ref: '#/components/schemas/MasqueradeAction'
      - $ref: '#/components/schemas/SnatAction'
      description: |-
        Specifies the action to take for packets that match a postrouting rule.

        Masquerade replaces the source address with the outgoing interface's IP address.
        Snat replaces the source address with a specific IP address and optional port.
    PostroutingRule:
      type: object
      required:
      - description
      - priority
      - match
      - action
      properties:
        action:
          $ref: '#/components/schemas/PostroutingAction'
        description:
          type: string
          description: Human-readable comment for a firewall rule. The value is restricted to printable ASCII without quotes or backslashes.
          pattern: ^[ -!#-\[\]-~]{0,128}$
        match:
          $ref: '#/components/schemas/OutboundMatch'
        priority:
          type: integer
          format: int32
          description: Sort order of the rule. Lower values are evaluated first.
          minimum: 0
    PreroutingRule:
      type: object
      required:
      - description
      - priority
      - match
      - action
      properties:
        action:
          $ref: '#/components/schemas/DnatAction'
        description:
          type: string
          description: Human-readable comment for a firewall rule. The value is restricted to printable ASCII without quotes or backslashes.
          pattern: ^[ -!#-\[\]-~]{0,128}$
        match:
          $ref: '#/components/schemas/InboundMatch'
        priority:
          type: integer
          format: int32
          description: Sort order of the rule. Lower values are evaluated first.
          minimum: 0
    ProbeTarget:
      type: string
      description: IPv4 address or hostname used as the probe target, optionally with a port (e.g. "1.1.1.1:5000"). If no port is specified, port 443 is used. IPv4 addresses are recommended for deterministic failover behavior. Hostname targets require DNS resolution before probing; DNS failures cause the probe to fail.
      examples:
      - 8.8.8.8
      - 1.1.1.1:5000
      - example.com
      maxLength: 253
      minLength: 1
    RealtimeConfig:
      type: object
      required:
      - cpu_isolation
      properties:
        cpu_isolation:
          $ref: '#/components/schemas/CpuIsolationConfig'
    RealtimeState:
      type: object
      required:
      - cpu_isolation
      properties:
        cpu_isolation:
          $ref: '#/components/schemas/CpuIsolationState'
    RecipeSigning:
      type: object
      required:
      - enabled
      - user_gpg_keys
      properties:
        enabled:
          type: boolean
          description: |-
            True if removable media update signing is enabled, false otherwise.

            If enabled, the recipe file of the removable media update must be signed with a GPG key that
            is added to the `user_gpg_keys` list in order to be accepted by the system.

            Note: Removable media update signing is always disabled before initial setup is complete.
        user_gpg_keys:
          type: object
          description: User specific GPG public keys that are used to verify removable media updates.
          additionalProperties:
            $ref: '#/components/schemas/GpgKey'
          propertyNames:
            type: string
            description: A GPG key ID that acts as a unique identifier for the key
            examples:
            - custom-gpg-key
            maxLength: 255
            minLength: 1
            pattern: ^[a-z][a-z\-0-9]*$
          example:
            another-gpg-key:
              content: |-
                -----BEGIN PGP PUBLIC KEY BLOCK-----

                ...
                -----END PGP PUBLIC KEY BLOCK-----
    RootAccessConfig:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    RuleAction:
      type: string
      description: |-
        Specifies if the matching packets should be dropped, accepted.
        If a packet is accepted or dropped, no further rules are evaluated for that packet.
        You can use the rule priority to control the order of rule evaluation. Lower values are evaluated first.
      enum:
      - DROP
      - ACCEPT
    SecuritySettings:
      type: object
      required:
      - root_access
      properties:
        root_access:
          $ref: '#/components/schemas/RootAccessConfig'
    ServerCa:
      oneOf:
      - $ref: '#/components/schemas/ServerCaVerify'
      - $ref: '#/components/schemas/ServerCaVerifyWithCa'
      - $ref: '#/components/schemas/ServerCaNoVerify'
      description: Server certificate verification configuration.
    ServerCaNoVerify:
      type: object
      description: Do not verify the server's certificate (insecure, use only for testing).
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - NO_VERIFY
    ServerCaVerify:
      type: object
      description: Verify the server's certificate using the system's CA certificate store.
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - VERIFY
    ServerCaVerifyWithCa:
      type: object
      description: |-
        Verify the server's certificate using a custom CA certificate.
        The CA certificate must be uploaded via PUT /syslog/certificates.
      required:
      - mode
      - ca
      properties:
        ca:
          type: string
          description: Name of the CA certificate file.
          example: my-corp-ca.pem
        mode:
          type: string
          enum:
          - VERIFY_WITH_CA
    ServiceInterfaceConfig:
      type: object
      description: Represents the configuration of the service interface.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    ServiceStatus:
      type: string
      description: Systemd service status.
      enum:
      - ACTIVE
      - INACTIVE
      - FAILED
      - ACTIVATING
      - DEACTIVATING
      - UNKNOWN
    SharedModeConfig:
      type: object
      description: Configuration options for interface sharing
      required:
      - enabled
      properties:
        dhcp_ip_range:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DhcpIpv4Range'
            description: |-
              Configure the DHCP server IP range.

              The IP range must be in the same subnet as the server address, otherwise an error will be returned.
              If not set, an IP range adjacent to the server address will be used.
              Should not contain network address or broadcast address.
        dhcp_lease_time_sec:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Configure the DHCP server lease time in seconds.

            Allowed values:

            - 0 or empty: Default lease time (1h)
            - 2147483647 (max int32): Infinite lease time
            - 120-31536000: Valid range between 2 minutes and 1 year
          minimum: 0
        enabled:
          type: boolean
          description: |-
            If enabled, this device acts as a mini router and may provide internet access to other devices connected to it.
            This includes enabling a DHCP server on the device, which will assign IP addresses to connected devices, as well as hosting a DNS server.
            Traffic will be forwarded through the outbound interface with the highest priority (lowest route metric).

            If enabled, all other properties of the interface are ignored, except for the first IP address in the addresses list,
            which is used as the server address for the DHCP server.
    SnatAction:
      type: object
      description: Write a specific source address to the packet.
      required:
      - mode
      - new_source
      properties:
        mode:
          type: string
          enum:
          - SNAT
        new_source:
          type: string
          description: IPv4 address only. Accepts 'A.B.C.D'.
        new_sport:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    StorageType:
      type: string
      enum:
      - Internal
      - Removable
    SyslogConfig:
      type: object
      description: Main configuration for syslog forwarding.
      required:
      - enabled
      - outputs
      properties:
        enabled:
          type: boolean
          description: Whether syslog forwarding is enabled. If false, the service is stopped.
        outputs:
          type: object
          description: |-
            Map of output name to output configuration.
            Output names must be 1-32 characters, containing only lowercase letters, numbers, and hyphens.
            Cannot start or end with a hyphen.
          additionalProperties:
            $ref: '#/components/schemas/SyslogOutputConfig'
          propertyNames:
            type: string
          example:
            my-log-server:
              destination:
                format: RFC5424
                host: 192.168.1.123
                port: 6514
                tls:
                  mode: ENABLED
                  server_ca:
                    ca: my-corp-ca.pem
                    mode: VERIFY_WITH_CA
                transport: TCP
              filter:
                facilities:
                - AUTH
                identifiers:
                - sudo
                - kernel
                levels:
                - ERR
                - WARNING
                units:
                - nginx.service
    SyslogDestination:
      type: object
      description: Destination server configuration.
      required:
      - host
      - port
      - transport
      - tls
      - format
      properties:
        format:
          $ref: '#/components/schemas/SyslogFormat'
          description: Syslog message format.
        host:
          type: string
          description: Server hostname or IP address.
          example: 192.168.1.100
        port:
          type: integer
          format: int32
          description: Server port number (514 for plain syslog, 6514 for TLS is common).
          example: 6514
          minimum: 0
        tls:
          $ref: '#/components/schemas/TlsConfig'
          description: TLS configuration. Determines whether TLS encryption is used (TCP only).
        transport:
          $ref: '#/components/schemas/Transport'
          description: 'Transport protocol: TCP or UDP.'
    SyslogFacility:
      type: string
      description: Standard syslog facilities as defined in RFC 5424.
      enum:
      - KERN
      - USER
      - MAIL
      - DAEMON
      - AUTH
      - SYSLOG
      - LPR
      - NEWS
      - UUCP
      - CRON
      - AUTHPRIV
      - FTP
      - NTP
      - AUDIT
      - ALERT
      - CLOCK
      - LOCAL0
      - LOCAL1
      - LOCAL2
      - LOCAL3
      - LOCAL4
      - LOCAL5
      - LOCAL6
      - LOCAL7
    SyslogFilter:
      type: object
      description: |-
        Syslog filter criteria.

        Filtering uses systemd journal's native logic:
        - Within a field: values are OR'd (e.g., level=err OR level=warning)
        - Across fields: conditions are AND'd (e.g., level=err AND facility=auth)
        - Empty fields match everything
      required:
      - levels
      - facilities
      - units
      - identifiers
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/SyslogFacility'
          description: |-
            Syslog facilities to include. Standard RFC 5424 facility codes.
            If empty, logs from all facilities are included.
            Your services can use local0-local7 for custom categorization.
        identifiers:
          type: array
          items:
            type: string
          description: |-
            Specific `SYSLOG_IDENTIFIER` values to include (e.g. 'kernel').

            Each identifier must:
            - Be at most 128 characters
            - Contain only: ASCII letters (a-z, A-Z), digits (0-9), '-', '_', '.'
            - Not be empty

            If empty, logs from all identifiers are included.
          example:
          - sudo
          - kernel
        levels:
          type: array
          items:
            $ref: '#/components/schemas/SyslogLevel'
          description: |-
            Log severity levels to include. Only logs with these exact levels are forwarded.
            If empty, logs of all severity levels are included.
        units:
          type: array
          items:
            type: string
          description: |-
            Specific systemd units to include.

            Each unit name must:
            - Be at most 255 characters
            - Contain only: ASCII letters (a-z, A-Z), digits (0-9), ':', '-', '_', '.', '@'
            - End with a valid unit suffix: .service, .socket, .device, .mount,
              .automount, .swap, .target, .path, .timer, .slice, or .scope

            Examples: "nginx.service", "sshd.socket", "user@1000.service"

            If empty, logs from all units are included.
          example:
          - nginx.service
          - fluent-bit.service
    SyslogFormat:
      type: string
      description: Syslog message format standard.
      enum:
      - RFC5424
      - RFC3164
    SyslogLevel:
      type: string
      description: Syslog severity levels as defined in RFC 5424.
      enum:
      - EMERG
      - ALERT
      - CRIT
      - ERR
      - WARNING
      - NOTICE
      - INFO
      - DEBUG
    SyslogOutputConfig:
      type: object
      description: |-
        A single syslog output destination with its filter criteria.
        The output name (map key) must be 1-32 characters, containing only lowercase letters,
        numbers, and hyphens. Cannot start or end with a hyphen.
      required:
      - destination
      - filter
      properties:
        destination:
          $ref: '#/components/schemas/SyslogDestination'
          description: The destination server configuration.
        filter:
          $ref: '#/components/schemas/SyslogFilter'
          description: Filter criteria - which logs to send to this output.
    SyslogState:
      type: object
      description: Runtime state of the syslog forwarding service.
      required:
      - status
      properties:
        outputs:
          type: object
          description: |-
            Per-output health information.
            Only populated when the service is active and the monitoring API is reachable.
          additionalProperties:
            $ref: '#/components/schemas/OutputState'
          propertyNames:
            type: string
        status:
          $ref: '#/components/schemas/ServiceStatus'
          description: Current service status from systemd.
      example:
        outputs:
          audit-logs:
            reachable: CONNECTED
          kernel-logs:
            reachable: ERROR
          my-app-logs:
            reachable: PENDING
        status: ACTIVE
    SystemInformation:
      type: object
      required:
      - cpu_architecture
      - firmware
      - memory
      properties:
        cpu_architecture:
          type: string
        firmware:
          $ref: '#/components/schemas/Firmware'
        memory:
          $ref: '#/components/schemas/Memory'
    TlsConfig:
      oneOf:
      - $ref: '#/components/schemas/TlsDisabled'
      - $ref: '#/components/schemas/TlsEnabled'
      - $ref: '#/components/schemas/TlsEnabledWithMtls'
      description: |-
        TLS configuration for encrypted syslog transport.
        Certificates are managed separately via the certificates endpoint.
    TlsDisabled:
      type: object
      description: TLS is disabled (plain-text transport).
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - DISABLED
    TlsEnabled:
      type: object
      description: TLS is enabled with the given settings.
      required:
      - mode
      - server_ca
      properties:
        mode:
          type: string
          enum:
          - ENABLED
        server_ca:
          $ref: '#/components/schemas/ServerCa'
          description: Server certificate verification mode.
    TlsEnabledWithMtls:
      type: object
      required:
      - mode
      - server_ca
      - client_cert
      - client_key
      properties:
        client_cert:
          type: string
          description: |-
            Name of the client certificate file.
            Must be uploaded via the certificates endpoint.
          example: device.pem
        client_key:
          type: string
          description: |-
            Name of the client private key file.
            Must be uploaded via the certificates endpoint.
          example: device-key.pem
        mode:
          type: string
          enum:
          - ENABLED_WITH_MTLS
        server_ca:
          $ref: '#/components/schemas/ServerCa'
    Transport:
      type: string
      description: Transport protocol for syslog. TLS is configured separately.
      enum:
      - TCP
      - UDP
    UpdateSettings:
      type: object
      description: Represents the update configuration for the system used in get and put.
      required:
      - signed_update
      properties:
        removable_media_update:
          type: object
          required:
          - enabled
          - recipe_signing
          properties:
            enabled:
              type: boolean
              description: |-
                True if removable media updates are enabled, false otherwise.

                Note: Removable media updates are always enabled before initial setup is complete.
                This value shows only the state after the initial setup.
            recipe_signing:
              $ref: '#/components/schemas/RecipeSigning'
              description: Settings related to signing of removable media updates.
        signed_update:
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              description: True if signed updates are enabled, false otherwise.
            preinstalled_gpg_keys:
              oneOf:
              - type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
                    description: |-
                      True if Preinstalled GPG keys are enabled, false otherwise.

                      All devices come with preinstalled preinstalled GPG keys to verify updates.
                      If this is set to false, those keys will be ignored during update verification.
                      User must upload their own GPG keys to verify updates in this case.
              description: |-
                Can be used to enable or disable preinstalled Preinstalled GPG keys.
                This can be useful e.g. to only allow custom, self signed updates to the device.
            user_gpg_keys:
              type: object
              description: User specific GPG public keys that are used to verify software updates.
              additionalProperties:
                $ref: '#/components/schemas/GpgKey'
              propertyNames:
                type: string
                description: A GPG key ID that acts as a unique identifier for the key
                examples:
                - custom-gpg-key
                maxLength: 255
                minLength: 1
                pattern: ^[a-z][a-z\-0-9]*$
              example:
                another-gpg-key:
                  content: |-
                    -----BEGIN PGP PUBLIC KEY BLOCK-----

                    ...
                    -----END PGP PUBLIC KEY BLOCK-----
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            u-os-adm.firewall.readonly: Read access for firewall endpoints
            u-os-adm.firewall.readwrite: Read and write access for firewall endpoints
            u-os-adm.logging.readonly: Read access for logging endpoints
            u-os-adm.network.readonly: Read access for network endpoints
            u-os-adm.network.readwrite: Read and write access for network endpoints
            u-os-adm.realtime.readonly: Read access for realtime endpoints
            u-os-adm.realtime.readwrite: Read and write access for realtime endpoints
            u-os-adm.recovery.readwrite: Read and write access for recovery endpoints
