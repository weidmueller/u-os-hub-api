  /syslog/certificates:
    get:
      tags:
      - syslog
      summary: Get all uploaded certificates.
      description: Returns all certificates organized by type with their content.
      operationId: get_certificates
      responses:
        '200':
          description: Certificate store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readonly
      - OAuth2:
        - u-os-adm.syslog.readwrite
    put:
      tags:
      - syslog
      summary: Set all certificates
      description: |-
        Replaces the entire certificate store. Any previously uploaded
        certificate not included in the request will be deleted.

        To ensure that certificates are unused after deletion, please reboot the device.
        Deleting a currently used certificate results in an invalid syslog configuration.

        **Certificate types:**
        - `server-ca`: CA certificate to verify the syslog server
        - `client-cert`: Client certificate for mTLS authentication
        - `client-key`: Client private key for mTLS authentication
      operationId: set_certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificates'
        required: true
      responses:
        '200':
          description: Certificates applied successfully
        '400':
          description: Invalid certificate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readwrite
    patch:
      tags:
      - syslog
      summary: Partially update certificates
      description: |-
        Applies a patch to the certificate store using JSON Merge Patch semantics:
        - **Absent type**: no changes to that category
        - **Entry with content**: add or overwrite that certificate
        - **Entry set to `null`**: delete that certificate

        To ensure that certificates are unused after deletion, please reboot the device.
        Deleting a currently used certificate results in an invalid syslog configuration.

        Example — add a new server CA and delete an old one:
        ```json
        {
            "server-ca": {
                "new-ca.pem": { "content": "-----BEGIN CERTIFICATE-----\n..." },
                "old-ca.pem": null
            }
        }
        ```
      operationId: patch_certificates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialCertificates'
        required: true
      responses:
        '200':
          description: Certificates updated successfully
        '400':
          description: Invalid certificate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.syslog.readwrite
  /syslog/config:
    get:
      tags:
      - syslog
      summary: Get syslog forwarding configuration.
      description: Returns the current configuration for syslog forwarding.
      operationId: get_config
      responses:
