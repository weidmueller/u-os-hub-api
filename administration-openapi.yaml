openapi: 3.1.0
info:
  title: Administration API
  description: HTTP API for administrating a u-OS device.
  contact:
    name: Weidmüller
  license:
    name: MIT
    identifier: MIT
  version: 1.5.0-next
servers:
- url: /u-os-adm/api/v1
paths:
  /firewall/active-config:
    get:
      tags:
      - firewall
      summary: Get the currently active firewall configuration.
      description: |-
        Check the `Persistence`- and `Rollback-At`-Header for the status of the configuration (persistent, temporary, time until rollback).

        The response carries an `ETag` header derived from the configuration. Use its value in an
        `If-Match` header when calling `PUT`/`PATCH` to guard against lost updates.

        The `Persistence` header indicates whether the active configuration is persistent or a temporary test configuration.

        The `Rollback-At` header (if present) specifies when the automatic rollback will occur.
        The timestamp is expressed in the device's system time.
        Clients should compare it with the `Date` header rather than their local clock when calculating the time remaining until the rollback.
      operationId: get_firewall_active_config
      responses:
        '200':
          description: The currently active firewall configuration
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
            Persistence:
              schema:
                type: string
              description: 'Persistence state of the configuration: `Persistent` (persisted across reboots) or `Temporary`.'
            Rollback-At:
              schema:
                type: string
              description: Only present when a `Temporary` configuration has a scheduled rollback. The time at which the configuration will automatically revert to the persistent configuration, represented as an HTTP-date (for example, `Sun, 06 Nov 2025 08:49:37 GMT`). The timestamp is expressed in the device's system time. Clients SHOULD compare it with the HTTP `Date` response header rather than their local clock when calculating the time remaining until the rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readonly
      - OAuth2:
        - u-os-adm.firewall.readwrite
    put:
      tags:
      - firewall
      summary: Set a temporary override on the active firewall configuration.
      description: |-
        This endpoint is intended to test a configuration before applying it persistently to prevent
        misconfigurations that could lock the user out of the system.

        Note that due to conntrack, existing connections will be kept intact even if the new configuration would block them.
        Only new connections will be subject to the new rules.

        The config will be applied directly and temporarily.
        Please use `/firewall/config` to apply a configuration persistently.

        By default the temporary config will be rolled back after reboot or `/firewall:reload`,
        but you can also set a timeout for the automatic rollback to the persistent configuration with the "timeout" query parameter (in seconds).

        Provide an `If-Match` header with the `ETag` of the currently active configuration to apply the
        change only if the active configuration has not been modified in the meantime (optimistic locking).
      operationId: set_firewall_active_config
      parameters:
      - name: timeout
        in: query
        description: |-
          Number of seconds after which the temporary configuration
          is automatically rolled back to the persistent configuration.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: If-Match
        in: header
        description: Apply the request only if the current resource version matches this `ETag` (optimistic locking). If no match is found, 412 is returned.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirewallConfig'
        required: true
      responses:
        '200':
          description: The firewall config has been applied temporarily
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
            Persistence:
              schema:
                type: string
              description: 'Persistence state of the configuration: `Persistent` (persisted across reboots) or `Temporary`.'
            Rollback-At:
              schema:
                type: string
              description: Only present when a `Temporary` configuration has a scheduled rollback. The time at which the configuration will automatically revert to the persistent configuration, represented as an HTTP-date (for example, `Sun, 06 Nov 2025 08:49:37 GMT`). The timestamp is expressed in the device's system time. Clients SHOULD compare it with the HTTP `Date` response header rather than their local clock when calculating the time remaining until the rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        '412':
          description: The supplied `If-Match` precondition did not match the current resource version. The resource was modified by someone else in the meantime. Re-fetch the resource to obtain the current `ETag` and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readwrite
    head:
      tags:
      - firewall
      summary: |-
        Check active firewall configuration metadata.
        Returns `ETag`, persistence state, and scheduled rollback time without transferring the configuration body.
      description: |-
        Returns the same `ETag`, `Persistence` and `Rollback-At` headers as `GET /firewall/active-config`
        but without a response body. Useful for cheaply polling the configuration's entity tag and
        rollback state.
      operationId: head_firewall_active_config
      responses:
        '200':
          description: Headers describing the active firewall configuration
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
            Persistence:
              schema:
                type: string
              description: 'Persistence state of the configuration: `Persistent` (persisted across reboots) or `Temporary`.'
            Rollback-At:
              schema:
                type: string
              description: Only present when a `Temporary` configuration has a scheduled rollback. The time at which the configuration will automatically revert to the persistent configuration, represented as an HTTP-date (for example, `Sun, 06 Nov 2025 08:49:37 GMT`). The timestamp is expressed in the device's system time. Clients SHOULD compare it with the HTTP `Date` response header rather than their local clock when calculating the time remaining until the rollback.
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readonly
      - OAuth2:
        - u-os-adm.firewall.readwrite
    patch:
      tags:
      - firewall
      summary: Modify the active firewall configuration with a temporary override.
      description: |-
        Same as the `PUT /firewall/active-config` endpoint but allows partial updates.
        If no temporary configuration is active, the persistent configuration is used as
        the basis for the PATCH and rolled out temporarily along with the change.

        See the `PUT /firewall/active-config` endpoint for details on the behavior of temporary configurations and the `If-Match` header.
      operationId: update_firewall_active_config
      parameters:
      - name: timeout
        in: query
        description: |-
          Number of seconds after which the temporary configuration
          is automatically rolled back to the persistent configuration.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: If-Match
        in: header
        description: Apply the request only if the current resource version matches this `ETag` (optimistic locking). If no match is found, 412 is returned.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialFirewallConfig'
        required: true
      responses:
        '200':
          description: The new active firewall config has been applied temporary
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
            Persistence:
              schema:
                type: string
              description: 'Persistence state of the configuration: `Persistent` (persisted across reboots) or `Temporary`.'
            Rollback-At:
              schema:
                type: string
              description: Only present when a `Temporary` configuration has a scheduled rollback. The time at which the configuration will automatically revert to the persistent configuration, represented as an HTTP-date (for example, `Sun, 06 Nov 2025 08:49:37 GMT`). The timestamp is expressed in the device's system time. Clients SHOULD compare it with the HTTP `Date` response header rather than their local clock when calculating the time remaining until the rollback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        '412':
          description: The supplied `If-Match` precondition did not match the current resource version. The resource was modified by someone else in the meantime. Re-fetch the resource to obtain the current `ETag` and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readwrite
  /firewall/config:
    get:
      tags:
      - firewall
      summary: Get the persistent firewall configuration.
      description: |-
        The persistent firewall configuration is permanently stored on the device and applied after each boot.

        The firewall configuration may have been overridden by a temporary configuration.
        Use the `/firewall/active-config` endpoint to get the currently active config.

        The response carries an `ETag` header derived from the persistent configuration. Use its value
        in an `If-Match` header on `PUT`/`PATCH` to guard against lost updates.
      operationId: get_firewall_config
      responses:
        '200':
          description: The current persistent firewall config
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readonly
      - OAuth2:
        - u-os-adm.firewall.readwrite
    put:
      tags:
      - firewall
      summary: Set the persistent firewall configuration.
      description: |-
        This will be applied directly and persistently. Please use `/firewall/active-config` beforehand to test a configuration without applying it persistently.
        A call to this endpoint also removes the temporary configuration if it exists.
      operationId: set_firewall_config
      parameters:
      - name: If-Match
        in: header
        description: Apply the request only if the current resource version matches this `ETag` (optimistic locking). If no match is found, 412 is returned.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirewallConfig'
        required: true
      responses:
        '200':
          description: The new persistent firewall config has been applied
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        '412':
          description: The supplied `If-Match` precondition did not match the current resource version. The resource was modified by someone else in the meantime. Re-fetch the resource to obtain the current `ETag` and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readwrite
    patch:
      tags:
      - firewall
      summary: Modify the persistent firewall configuration.
      description: Same as the `PUT /firewall/config` endpoint but allows partial updates.
      operationId: update_firewall_config
      parameters:
      - name: If-Match
        in: header
        description: Apply the request only if the current resource version matches this `ETag` (optimistic locking). If no match is found, 412 is returned.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartialFirewallConfig'
        required: true
      responses:
        '200':
          description: The new persistent firewall config has been applied
          headers:
            ETag:
              schema:
                type: string
              description: Opaque token identifying the current resource version. Return it unchanged in the `If-Match` header on subsequent `PUT`/`PATCH` requests to prevent lost updates (optimistic locking).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        '412':
          description: The supplied `If-Match` precondition did not match the current resource version. The resource was modified by someone else in the meantime. Re-fetch the resource to obtain the current `ETag` and retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readwrite
  /firewall:reload:
    post:
      tags:
      - firewall
      summary: Reloads the firewall configuration, which deletes the temporary config and rolls back to the persistent config.
      description: |-
        But does nothing if no temporary firewall configuration is active.

        The temporary config will be deleted! Use `/firewall/config` to persist the temporary config if you want to keep the changes.
      operationId: reload_firewall_config
      responses:
        '200':
          description: The temporary firewall config has been deleted and the persistent config has been applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.firewall.readwrite
  /logging/entries:
    get:
      tags:
      - logging
      summary: Get all log entries.
      description: The entries can be filtered and accessed via pagination.
      operationId: get_logging_entries
      parameters:
      - name: cursor
        in: query
        description: |-
          The cursor is used to paginate through the log entries.
          It's empty for the first page.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          Number of requested entries.
          Default is 100.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: sources
        in: query
        description: |-
          Filter parameter for log sources.
          The exact name of the source must be indicated.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: filter_msgs
        in: query
        description: |-
          Only include log entries whose message contains all filter-strings.
          Not case sensitive. If not set or empty, all messages will be included.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Log entries found sucessfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntryResponse'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/reports:
    post:
      tags:
      - logging
      summary: Trigger the generation of a report.
      description: |-
        The report will contain the current system logs.
        The report generation is a long-running operation.
        You can poll the status of the operation using the `/operations/{operation_id}` endpoint.
      operationId: create_logging_report
      responses:
        '202':
          description: The generation of the report has been started successfully.
          headers:
            Location:
              schema:
                type: string
              description: URL of the operation resource to poll for status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLogReportResponse'
        '409':
          description: A report generation is already in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/reports/{report_id}:
    get:
      tags:
      - logging
      summary: Get the report by the given report_id.
      description: |-
        The report is a gzipped tar archive containing all system logs.
        You need to trigger the report generation first using the `/logging/reports` endpoint.
      operationId: get_logging_report
      parameters:
      - name: report_id
        in: path
        description: ID of the report to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Report found sucessfully
          content:
            application/octet-stream: {}
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /logging/sources:
    get:
      tags:
      - logging
      summary: Get available log sources.
      description: All log sources will be listed here, for examples all systemd services.
      operationId: get_logging_sources
      responses:
        '200':
          description: Log sources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogSourcesResponse'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.logging.readonly
  /network/config:
    get:
      tags:
      - network
      summary: Get the current network configuration of the device.
      description: This only returns fields that can be configured and changed via the HTTP API.
      operationId: get_network_config
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readonly
      - OAuth2:
        - u-os-adm.network.readwrite
    put:
      tags:
      - network
      summary: Set the full network configuration of the device.
      description: |-
        This endpoint sets the network configuration of the device. Must include all supported settings and interfaces.
        Will return the updated configuration on success.

        Note that some network properties are not yet supported by the API.
        These properties will be unaffected when applying the changes, thus preserving any manual changes.
      operationId: set_network_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
        required: true
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readwrite
    patch:
      tags:
      - network
      summary: Modify the network configuration of the device.
      description: |-
        This endpoint modifies the network configuration of the device by applying a JSON merge patch (https://datatracker.ietf.org/doc/html/rfc7396)
        to the current configuration.
        Will return the updated configuration after applying the patch on success.

        Note that some network properties are not yet supported by the API.
        These properties will be unaffected when applying the changes, thus preserving any manual changes.
      operationId: update_network_config
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PartialNetworkConfig'
        required: true
      responses:
        '200':
          description: Network config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readwrite
  /network/state:
    get:
      tags:
      - network
      summary: Get the current network state of the device.
      description: This includes properties that can not be configured via the HTTP API, like the current IP addresses and routing table.
      operationId: get_network_state
      responses:
        '200':
          description: Network state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkState'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readonly
      - OAuth2:
        - u-os-adm.network.readwrite
  /network:factory-reset:
    post:
      tags:
      - network
      summary: Triggers a network settings factory reset.
      description: Resets all network settings to factory defaults, which erases all user-defined network configurations on the system.
      operationId: network_factory_reset
      parameters:
      - name: do_reboot
        in: query
        description: Whether the system should reboot after resetting the network settings.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Network settings reset successfully.
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.network.readwrite
  /openapi.json:
    get:
      tags:
      - openapi
      summary: Get the current API spec
      description: Returns the current OpenAPI specification of the u-OS Admin API. This is useful for clients to discover the API endpoints and their parameters.
      operationId: get_openapi
      responses:
        '200':
          description: OpenAPI specification JSON
          content:
            application/json: {}
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2: []
  /operations/{operation_id}:
    get:
      tags:
      - operations
      summary: Get the status of a long running operation by its ID.
      description: The operation ID can only be retained at the time it is created.
      operationId: get_operation
      parameters:
      - name: operation_id
        in: path
        description: ID of the operation
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Status of the long running operation
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource as result of the long running operation. This is only the case when the process has been completed and a resource has been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationState'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2: []
  /realtime/config:
    get:
      tags:
      - realtime
      summary: Get the realtime configuration for the system.
      description: |-
        Notice that changing the realtime configuration requires a system reboot to take effect.
