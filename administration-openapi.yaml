  /update/config:
    get:
      tags:
      - update
      summary: Get the update configuration for the system.
      description: The update configuration contains settings related to updating a u-OS device.
      operationId: get_update_settings
      responses:
        '200':
          description: Update configuration found successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readonly
      - OAuth2:
        - u-os-adm.update.readwrite
    put:
      tags:
      - update
      summary: Set the update configuration for the system.
      description: |-
        The update configuration contains settings related to updating a u-OS device.
        Updating the configuration will restart the update service to apply new settings.
      operationId: set_update_settings
      requestBody:
        description: Update configuration to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettings'
        required: true
      responses:
        '200':
          description: Update configuration updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readwrite
    patch:
      tags:
      - update
      summary: Modify the update configuration of the device.
      description: |-
        This endpoint modifies the update configuration of the device by applying a JSON merge patch (<https://datatracker.ietf.org/doc/html/rfc7396>)
        to the current configuration.
        Will return the updated configuration after applying the patch on success.
      operationId: update_update_settings
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PartialUpdateSettings'
        required: true
      responses:
        '200':
          description: The updated configuration after applying the merge patch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSettings'
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpErrorPayload'
      security:
      - OAuth2:
        - u-os-adm.update.readwrite
components:
  schemas:
    AddressInformation:
      type: object
      description: Contains the address information of the device. Part of the device nameplate.
      required:
      - Street
      - Zipcode
      - CityTown
      - NationalCode
      properties:
        CityTown:
          type: string
        NationalCode:
          type: string
        Street:
          type: string
        Zipcode:
          type: string
    CertificateEntry:
      type: object
      description: A single certificate entry.
      required:
      - content
      properties:
        content:
          type: string
          description: PEM-encoded certificate or key content.
    Certificates:
      type: object
      description: |-
        All certificates organized by type.

        Each certificate type maps certificate names (keys) to their entries.
      required:
      - server_ca
      - client_cert
      - client_key
      properties:
        client_cert:
          type: object
          description: Client certificates for mutual TLS authentication.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        client_key:
          type: object
          description: Client private keys for mutual TLS authentication.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
        server_ca:
          type: object
          description: CA certificates for verifying the syslog server's identity.
          additionalProperties:
            $ref: '#/components/schemas/CertificateEntry'
          propertyNames:
            type: string
      example:
        client_cert:
          device.pem:
            content: |-
              -----BEGIN CERTIFICATE-----
              ...
              -----END CERTIFICATE-----
        client_key:
          device-key.pem:
            content: M15UP3RS5CR3T
        server_ca:
          my-ca.pem:
            content: |-
              -----BEGIN CERTIFICATE-----
              ...
              -----END CERTIFICATE-----
    CpuIsolationConfig:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    CpuIsolationState:
      type: object
      required:
      - enabled
      - effective_cpus
      properties:
        effective_cpus:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: |-
            Lists the CPU cores effectively used for real-time tasks when CPU isolation is enabled.
            CPU core numbers are zero-based. For example, `[3]` means that only the fourth CPU core is used for real-time tasks.
          example:
          - 1
        enabled:
          type: boolean
          description: |-
            Indicates whether CPU isolation is currently active.
            This reflects the current system state, not the desired state after a reboot.
            To view the desired state after a reboot, use the realtime configuration endpoint.
    CreateLogReportResponse:
      type: object
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
    DeviceNameplate:
      type: object
      description: |-
        Contains the device nameplate information.

        Based on [IDTA 02006-3-0 Digital Nameplate for industrial equipment specification](https://github.com/admin-shell-io/submodel-templates/tree/main/published/Digital%20nameplate/3/0)
      required:
      - URIOfTheProduct
      - ManufacturerName
      - ManufacturerProductDesignation
      - AddressInformation
      - OrderCodeOfManufacturer
      properties:
        AddressInformation:
          $ref: '#/components/schemas/AddressInformation'
        HardwareVersion:
          type:
          - string
          - 'null'
        ManufacturerName:
          type: string
        ManufacturerProductDesignation:
          type: string
        ManufacturerProductType:
          type:
          - string
          - 'null'
        OrderCodeOfManufacturer:
          type: string
        SerialNumber:
          type:
          - string
          - 'null'
        SoftwareVersion:
          type:
          - string
          - 'null'
        URIOfTheProduct:
          type: string
        YearOfConstruction:
          type:
          - string
          - 'null'
    DhcpIpv4Range:
      type: object
      description: Represents a range of IPv4 addresses
      required:
      - start
      - end
      properties:
        end:
          $ref: '#/components/schemas/Ipv4String'
          description: End of the range (inclusive)
        start:
          $ref: '#/components/schemas/Ipv4String'
          description: Start of the range (inclusive)
    Disk:
      type: object
      required:
      - device_path
      - mount_points
      - file_system
      - total_size
      - free_size
      - storage_type
      properties:
        device_path:
          type: string
        file_system:
          type: string
        free_size:
          type: integer
          format: int64
          minimum: 0
        mount_points:
          type: array
          items:
            type: string
        storage_type:
          $ref: '#/components/schemas/StorageType'
        total_size:
          type: integer
          format: int64
          minimum: 0
    Disks:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disk'
    DnatAction:
      oneOf:
      - $ref: '#/components/schemas/DnatActionForward'
      - $ref: '#/components/schemas/DnatActionRedirect'
    DnatActionForward:
      type: object
      description: Forward to another host/port.
      required:
      - mode
      - new_destination
      properties:
        mode:
          type: string
          enum:
          - FORWARD
        new_destination:
          type: string
          description: IPv4 address only. Accepts 'A.B.C.D'.
        new_dport:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 65535
          minimum: 0
    DnatActionRedirect:
      type: object
      description: Redirect to the firewall host itself
      required:
      - mode
      - local_dport
      properties:
        local_dport:
          type: integer
          format: int32
          maximum: 65535
          minimum: 0
        mode:
          type: string
          description: Redirect to the firewall host itself
          enum:
          - REDIRECT
    FailoverGlobalConfig:
      type: object
      description: |-
        Global failover configuration.

        Controls the probe loop that monitors all configured interfaces and adjusts
        their route metrics based on connectivity probe results.
      required:
      - probe_interval_seconds
      - failure_threshold
      - success_threshold
      properties:
        failure_threshold:
          type: integer
          format: int32
          description: Number of consecutive failed probes before an interface is considered failed and penalised.
          example: 3
          minimum: 1
        probe_interval_seconds:
          type: integer
          format: int64
          description: Interval between failover probes in seconds.
          example: 10
          minimum: 1
        success_threshold:
          type: integer
          format: int32
          description: Number of consecutive successful probes before an interface is considered healthy and unpenalised.
          example: 3
          minimum: 1
    FailoverInterfaceConfig:
      type: object
      description: |-
        Failover configuration for a single monitored interface.

        When enabled, the probe loop checks connectivity on this interface. If
        `failure_threshold` consecutive probes fail the interface is penalised by
        settings its active metric to `failed_metric`. Once `success_threshold`
        consecutive probes succeed the metric is restored to the interface's
        configured `metric` value.
      required:
      - enabled
      - probe_target
      - failed_metric
      properties:
        enabled:
          type: boolean
          description: Whether failover probing is enabled for this interface.
        failed_metric:
          type: integer
          format: int32
          description: |-
            Network interface metric (priority) that is applied when the interface has failed probing.
            Should be higher than all normal interface metrics to ensure traffic is routed through healthy interfaces.
          example: 20000
          maximum: 2147483647
          minimum: 1
        probe_target:
          $ref: '#/components/schemas/ProbeTarget'
          description: Probe target for connectivity checks (IPv4 address or hostname, optionally with port e.g. "1.1.1.1:5000").
    FilterRules:
      type: object
      required:
      - policy
      - input
      - output
      - forward
      properties:
        forward:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ForwardRule'
          propertyNames:
            type: string
            description: Identifier of a firewall rule. Used as the map key and to reference it in patch operations.
            pattern: ^[A-Za-z0-9:._-]{1,63}$
        input:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InputRule'
          propertyNames:
            type: string
            description: Identifier of a firewall rule. Used as the map key and to reference it in patch operations.
            pattern: ^[A-Za-z0-9:._-]{1,63}$
        output:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OutputRule'
          propertyNames:
            type: string
            description: Identifier of a firewall rule. Used as the map key and to reference it in patch operations.
            pattern: ^[A-Za-z0-9:._-]{1,63}$
        policy:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InterfacePolicy'
          propertyNames:
            type: string
    FirewallConfig:
      type: object
      description: |-
        Custom firewall configuration. Contains filter and nat rules.

        If an array is empty, it means "match all".
        For example, an `InputRule` with an empty `source` matches packets from any source address.

        Connections in the established or related conntrack state are accepted automatically. Therefore, no explicit rules are required for the return path.
      required:
      - filter
      - nat
      properties:
        filter:
          $ref: '#/components/schemas/FilterRules'
        nat:
          $ref: '#/components/schemas/NatRules'
      example:
        filter:
          forward: {}
          input:
            allow-192.168.1.120:
              action: ACCEPT
              description: Allow packets from '192.168.1.120'
              match:
                destination: []
                dport: []
                in_interface:
                - eth-x4
                protocol: ANY
                source:
                - 192.168.1.120
                sport: []
              priority: 100
          output:
            allow-192.168.1.120:
              action: ACCEPT
              description: Allow packets to '192.168.1.120
              match:
                destination:
                - 192.168.1.120
                dport: []
                out_interface:
                - eth-x4
                protocol: ANY
                source: []
                sport: []
              priority: 100
          policy:
            eth-x4:
              forward: DROP
              input: DROP
              output: DROP
            eth-x5:
              forward: OS_DEFAULT
              input: OS_DEFAULT
              output: OS_DEFAULT
        nat:
          postrouting:
            masquerade-to-192.168.3.122:
              action:
                mode: MASQUERADE
              description: Masquerade forwarded packets so replies return via the firewall
              match:
                destination:
                - 192.168.3.122
                dport: []
                out_interface:
                - eth-x5
                protocol: ANY
                source: []
                sport: []
              priority: 100
          prerouting:
            forward-8080-to-192.168.3.122:
              action:
                mode: FORWARD
                new_destination: 192.168.3.122
                new_dport: 80
              description: Forward incoming TCP port 8080 to '192.168.3.122:80'
              match:
                destination: []
                dport:
                - '8080'
                in_interface:
                - eth-x4
                protocol: TCP
                source: []
                sport: []
              priority: 100
    Firmware:
      type: object
      required:
      - name
      - version
      properties:
        name:
          type: string
        version:
          type: string
    ForwardMatch:
      allOf:
      - type: object
        required:
        - protocol
        - dport
        - sport
        - source
        - destination
        properties:
          destination:
            type: array
            items:
              type: string
              description: |-
                IPv4 address, CIDR subnet, or address range. Accepts 'A.B.C.D', 'A.B.C.D/N',
                or 'A.B.C.D-A.B.C.D'.
          dport:
            type: array
            items:
              type: string
              description: TCP/UDP port (0..=65535) or inclusive port range. Accepts 'PORT' or 'START-END'.
          protocol:
            type: string
            description: |-
              Specifying `sport` or `dport` with the protocol set to `ANY` implicitly limits protocol matching
              to TCP, UDP, SCTP, and DCCP, as only these protocols support port numbers.
              Otherwise, `ANY` matches all protocols.
            enum:
            - ANY
            - TCP
            - UDP
            - ICMP
          source:
            type: array
            items:
              type: string
              description: |-
                IPv4 address, CIDR subnet, or address range. Accepts 'A.B.C.D', 'A.B.C.D/N',
                or 'A.B.C.D-A.B.C.D'.
          sport:
            type: array
            items:
              type: string
              description: TCP/UDP port (0..=65535) or inclusive port range. Accepts 'PORT' or 'START-END'.
      - type: object
        required:
        - in_interface
        - out_interface
        properties:
          in_interface:
            type: array
            items:
              type: string
              description: Name of an Ethernet interface or wildcard. Limited to 1..=15 visible characters with an optional trailing '*' wildcard, or a bare '*'.
              pattern: ^(?:\*|[A-Za-z0-9_.][A-Za-z0-9_.-]{0,14}\*?)$
          out_interface:
            type: array
            items:
              type: string
              description: Name of an Ethernet interface or wildcard. Limited to 1..=15 visible characters with an optional trailing '*' wildcard, or a bare '*'.
              pattern: ^(?:\*|[A-Za-z0-9_.][A-Za-z0-9_.-]{0,14}\*?)$
    ForwardRule:
      type: object
      required:
      - description
      - priority
      - match
      - action
      properties:
        action:
          $ref: '#/components/schemas/RuleAction'
        description:
          type: string
          description: Human-readable comment for a firewall rule. The value is restricted to printable ASCII without quotes or backslashes.
          pattern: ^[ -!#-\[\]-~]{0,128}$
        match:
          $ref: '#/components/schemas/ForwardMatch'
        priority:
          type: integer
          format: int32
          description: Sort order of the rule. Lower values are evaluated first.
          minimum: 0
    GlobalDnsServers:
      type: object
      description: |-
        Represents the global DNS servers used by the system.

        The order of the servers represents their priority, with the first one being the primary DNS server unless an interface overrides it.
      required:
      - servers
      - searches
      properties:
        searches:
          type: array
          items:
            type: string
          example:
          - .
        servers:
          type: array
          items:
            $ref: '#/components/schemas/Ipv4String'
    GpgKey:
      type: object
      description: The content of a GPG public key file in ASCII armor format.
      required:
      - content
      properties:
        content:
          type: string
          description: 'Hint: Newlines are forbidden in JSON strings, so you need to escape them.'
          example: |-
            -----BEGIN PGP PUBLIC KEY BLOCK-----

            ...
            -----END PGP PUBLIC KEY BLOCK-----
    HttpErrorPayload:
      type: object
      description: |-
        Common error payload structure for HTTP responses.

        Based on [RFC 9457](https://datatracker.ietf.org/doc/html/rfc9457)
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Optional details about the error
          example: 'Low Level OS Error #1234'
        instance:
          type:
          - string
          - 'null'
          format: uri-reference
          description: A human-readable explanation specific to this occurrence of the problem
          example: null
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 500
          maximum: 599
          minimum: 100
        title:
          type: string
          description: Human-readable error message.
          example: Something went wrong in the backend.
        type:
          type: string
          format: uri-reference
          description: |-
            A URI reference that identifies the problem type

            The last part of the URI is always a `ErrorId`
          example: /u-os-adm/api/v1/errors/set-security-settings
