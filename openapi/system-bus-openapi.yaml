openapi: 3.1.1

info:
  title: System bus Management API
  version: 1.0.0
  description: HTTP API for managing the u-OS system bus and sub busses.
  contact:
    name: Weidmüller
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /u-os-sbm/api/v1
    description: A synchronous HTTP API for accessing the local system bus manager (u-os-sbm) of u-OS.

tags:
  - name: devices
    description: Information related to connected devices and subdevices
  - name: operations
    description: API for u-OS long running operations
  - name: openapi
    description: API for reading the OpenAPI specification
  - name: ping
    description: API for checking the availability of u-os-adm

components:
  schemas:
    FirmwareUpdateFile:
      type: object
      properties:
        firmware_file:
          type: string
          format: binary
          maxLength: 104857600
          description: Firmware file to upload.
      required:
        - firmware_file
    FormatlessString:
      type: string
      format: string
      maxLength: 1024
    HttpErrorObject:
      type: object
      description: |-
        Common error payload structure for HTTP responses.
        Based on [RFC 9457](https://datatracker.ietf.org/doc/html/rfc9457)
      required:
        - title
        - status
        - type
      properties:
        title:
          type: string
          maxLength: 128
          format: string
          description: Human-readable error message.
          example: Something went wrong in the backend.
        detail:
          type: string
          maxLength: 1024
          format: string
          description: Optional details about the error.
          example: "Low Level OS Error #1234"
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 500
          maximum: 599
          minimum: 100
        type:
          type: string
          maxLength: 1024
          format: uri-reference
          description: A URI reference that identifies the problem type.
          example: /u-os-sbm/api/v1/errors/get-provider-configuration
        instance:
          type: string
          format: uri-reference
    LroAcceptedResponse:
      type: object
      required:
        - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
          maxLength: 36
    ModuleDescription:
      type: object
      description: A module connected to the system bus.
      properties:
        slot:
          $ref: "#/components/schemas/ModuleSlot"
        module_id:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        name:
          type: string
          maxLength: 255
          format: string
        serial_number:
          type: string
          maxLength: 255
          format: string
        order_number:
          type: string
          maxLength: 255
          format: string
        hw_version:
          type: string
          maxLength: 255
          format: string
        sw_version:
          type: string
          maxLength: 255
          format: string
        eeprom_version:
          type: string
          maxLength: 255
          format: string
        calibration_date:
          type: string
          maxLength: 255
          format: string
    ModuleSlot:
      type: integer
      format: int32
      minimum: 0
      maximum: 63
    ModuleState:
      type: object
      description: The current state of a module connected to the system bus.
      required:
        - slot
        - plug_state
      properties:
        slot:
          $ref: "#/components/schemas/ModuleSlot"
        plug_state:
          type: string
          enum:
            ["OK", "ERRONEOUS", "PENDING", "UNPLUGGED", "MISMATCH", "UNKNOWN"]
          description: The current plug state of the module.
    OperationKind:
      type: string
      enum: ["SET_MODULE_FIRMWARE", "SET_MODULE_FIRMWARE_ALL"]
      description: The kind of the long running operation.
    OperationList:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          maxLength: 36 # textual representation of a UUID
        is_running:
          type: boolean
          description: Indicates whether the operation is still running
        kind:
          oneOf:
            - $ref: "#/components/schemas/OperationKind"
      required:
        - operation_id
        - kind
    OperationState:
      oneOf:
        - $ref: "#/components/schemas/OperationStateSetModuleFirmware"
        - $ref: "#/components/schemas/OperationStateSetModuleFirmwareAll"
    OperationStateSetModuleFirmware:
      type: object
      properties:
        kind:
          type: string
          const: "SET_MODULE_FIRMWARE"
        state:
          type: string
          enum: ["UNSPECIFIED", "IN_PROGRESS", "SUCCEEDED", "FAILED"]
        progress_percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: The reported firmware update progress in percent (0-100). On failure, the last valid progress value is retained.
        slot:
          $ref: "#/components/schemas/ModuleSlot"
          description: The module slot number being updated.
        timestamp:
          type: string
          format: date-time
          maxLength: 1023
          description: The timestamp of when the firmware update finished (succeeded or failed), formatted as ISO 8601 when available. Empty string when no final timestamp is available yet.
        requires_power_cycle:
          type: boolean
          description: Indicates that a PLC power cycle is required to apply the firmware update. This becomes true after a successful firmware update.
          example: false
        failure_message:
          type: string
          maxLength: 1024
          pattern: "^.*$"
          description: Error message if the firmware update failed. Only present when state is FAILED.
      required:
        - kind
        - state
        - progress_percent
        - slot
        - timestamp
        - requires_power_cycle
    OperationStateSetModuleFirmwareAll:
      type: object
      properties:
        kind:
          type: string
          const: "SET_MODULE_FIRMWARE_ALL"
        state:
          type: string
          enum: ["UNSPECIFIED", "IN_PROGRESS", "SUCCEEDED", "FAILED"]
        timestamp:
          type: string
          format: date-time
          maxLength: 1023
          description: The timestamp of when the firmware update finished (succeeded or failed), formatted as ISO 8601 when available. Empty string when no final timestamp is available yet.
        requires_power_cycle:
          type: boolean
          description: Indicates that a PLC power cycle is required to apply the firmware update. This becomes true after a successful firmware update.
          example: false
        total_count:
          type: integer
          format: int32
          minimum: 0
          description: The total number of module slots to be updated.
        current_count:
          type: integer
          format: int32
          minimum: 0
          description: The current slot number being updated (0-based index).
        queue:
          type: array
          items:
            $ref: "#/components/schemas/OperationStateSetModuleFirmwareAllQueueItem"
          description: The queue of module slots to be updated.
      required:
        - kind
        - state
        - queue
        - total_count
        - current_count
        - timestamp
        - requires_power_cycle
    OperationStateSetModuleFirmwareAllQueueItem:
      type: object
      properties:
        slot:
          $ref: "#/components/schemas/ModuleSlot"
        progress_percent:
          $ref: "#/components/schemas/PercentValue"
          description: The reported firmware update progress in percent (0-100). On failure, the last valid progress value is retained.
        failure_message:
          $ref: "#/components/schemas/FormatlessString"
        state:
          type: string
          enum: ["UNSPECIFIED", "QUEUED", "IN_PROGRESS", "SUCCEEDED", "FAILED"]
          description: The current state of the firmware update for this module slot.
    PercentValue:
      type: integer
      format: int32
      minimum: 0
      maximum: 100
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            u-os-sbm.device-firmware-update.access: Access for updating device firmware
            u-os-sbm.io-configurator.readonly: Read access for IO configurator endpoints
            u-os-sbm.io-configurator.readwrite: Read and write access for IO configurator endpoints
      description: The HTTP API uses the OAuth2 client credentials flow.

paths:
  /devices:
    get:
      tags:
        - devices
      summary: Retrieve the list of currently connected system bus devices.
      description: |-
        This endpoint can be used to retrieve a list of currently connected devices.
        The response will contain basic information about each device, such as its name, module id and version information.
      operationId: get_devices_list
      responses:
        "200":
          description: Devices retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleDescription"
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for a detailed error message.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2:
            - u-os-sbm.io-configurator.readonly
        - OAuth2:
            - u-os-sbm.io-configurator.readwrite
  /devices/state:
    get:
      tags:
        - devices
      summary: Retrieve the current state of the devices
      description: |-
        This endpoint can be used to find out the current state of all connected devices.
        Use this endpoint to get the information if there are any alarms pending.
      operationId: get_devices_state
      parameters: []
      responses:
        "200":
          description: Devices state retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleState"
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for a detailed error message.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2:
            - u-os-sbm.io-configurator.readonly
        - OAuth2:
            - u-os-sbm.io-configurator.readwrite
  /devices/firmware:
    put:
      tags:
        - devices
      summary: Update firmware of all connected matching devices.
      description: |-
        Upload a firmware file and trigger firmware update for all connected modules which match the firmware file.
      operationId: set_all_matching_modules_firmware
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FirmwareUpdateFile"
      responses:
        "202":
          description: Firmware update accepted and started in background.
          headers:
            Location:
              schema:
                type: string
                pattern: "^.*$"
                maxLength: 255
              description: URL of the operation resource to poll for status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LroAcceptedResponse"
        "400":
          description: Invalid request, e.g. missing file
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
        "409":
          description: Firmware update already in progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
        default:
          description: Common HTTP Error codes may be thrown by this method, 401, 403 or 422. See body for a detailed error message.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2:
            - u-os-sbm.device-firmware-update.access
  /devices/{slot}/firmware:
    put:
      tags:
        - devices
      summary: Update firmware of a given module.
      description: |-
        Upload a firmware file and trigger firmware update for the module in the provided slot.
      operationId: set_module_firmware
      parameters:
        - name: slot
          in: path
          required: true
          description: Module slot to update (0..63).
          schema:
            $ref: "#/components/schemas/ModuleSlot"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FirmwareUpdateFile"
      responses:
        "202":
          description: Firmware update accepted and started in background.
          headers:
            Location:
              schema:
                type: string
                pattern: "^.*$"
                maxLength: 255
              description: URL of the operation resource to poll for status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LroAcceptedResponse"
        "400":
          description: Invalid request, e.g. missing file or invalid slot number
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
        "409":
          description: Firmware update already in progress
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
        default:
          description: Common HTTP Error codes may be thrown by this method, 401, 403 or 422. See body for a detailed error message.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2:
            - u-os-sbm.device-firmware-update.access

  /operations:
    get:
      tags:
        - operations
      summary: List all long running operations.
      description: Retrieve a list of all long running operations that have been initiated.
      operationId: get_operation_list
      responses:
        "200":
          description: List of long running operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationList"
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2:
            - u-os-sbm.io-configurator.readonly
        - OAuth2:
            - u-os-sbm.io-configurator.readwrite
  /operations/{operation_id}:
    get:
      tags:
        - operations
      summary: Get the status of a long running operation by its ID.
      description: The operation ID can only be obtained at the time it is created.
      operationId: get_operation
      parameters:
        - name: operation_id
          in: path
          description: ID of the operation
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: Status of the long running operation
          headers:
            Location:
              schema:
                type: string
                maxLength: 255
                pattern: "^.*$"
              description: URL of the created resource as result of the long running operation. This is only the case when the process has been completed and a resource has been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationState"
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2: []

  /openapi.json:
    get:
      tags:
        - openapi
      summary: Get the current API specification
      description: Returns the current OpenAPI specification of the u-OS system bus Management API. This is useful for clients to discover the API endpoints and their parameters.
      operationId: get_openapi
      responses:
        "200":
          description: OpenAPI specification in JSON format
          content:
            application/json: {}
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 412, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2: []

  /ping:
    get:
      tags:
        - ping
      summary: Minimal endpoint to verify the backend is started and reachable.
      description: Requires no authorization and always returns `200 OK`.
      operationId: ping
      responses:
        "200":
          description: Backend is reachable.
        default:
          description: Common HTTP Error codes may be thrown by this method, such as 400, 401, 403, 404, 412, 422 or 500. See body for detailed error info.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/HttpErrorObject"
      security:
        - OAuth2: []
