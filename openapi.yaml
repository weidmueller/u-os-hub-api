openapi: 3.0.3
info:
  title: u-OS Data Hub HTTP API
  description: |-
    The u-OS Data Hub is a standardized way of communicating for system services and apps. This document describes the HTTP API for accessing the u-OS Data Hub as a consumer.
    <br><br>
    Each participant at the Data Hub is either a consumer, a provider or both. A *consumer* can list/get available providers and list/get/update variables published by providers. A *provider* publishes variables to the Data Hub.
  contact:
    name: Weidmüller Interface GmbH & Co. KG
    url: https://www.weidmueller.com/
    email: oss@weidmueller.com
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT.html
  version: 0.1.0
servers:
- url: /data-hub/api/v1
  description: A synchronous HTTP API for accessing the local u-OS Data Hub.
paths:
  /providers:
    get:
      tags:
      - Consumer
      summary: List providers.
      description: List providers.
      operationId: get_providers_handler
      responses:
        '200':
          description: A list of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseSingleProvider'
              example:
              - id: web-plc
                links:
                  variables: /data-hub/api/v1/providers/web-plc/variables
              - id: sys
                links:
                  variables: /data-hub/api/v1/providers/sys/variables
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '500':
          description: Internal server error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
      security:
      - OAuth2:
        - hub.variables.readonly
        - hub.variables.readwrite
  /providers/{provider_id}/variables:
    get:
      tags:
      - Consumer
      summary: List variable values of a single provider.
      description: List all variable values or a subset of variable values of a single provider with or without variable definitions.
      operationId: get_variables_handler
      parameters:
      - name: provider_id
        in: path
        description: Id of a provider
        required: true
        schema:
          $ref: '#/components/schemas/ProviderName'
      - name: prefixes
        in: query
        description: |-
          This parameter is used to filter variables by prefixes. The parameter shall contain a comma-separated list of prefixes. The response will include all variables where the variable key matches one of the given prefixes.
                      The endpoint will filter out duplicates: Each variable will occur only once in the response array.
                      Since the names might contain '/' characters, the parameter needs to be URL-encoded.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/Prefixes'
          nullable: true
      - name: definition
        in: query
        description: If true, the response will contain variable definitions.
        required: false
        schema:
          type: boolean
          nullable: true
      responses:
        '200':
          description: Variables of a single provider with or without variable definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponseSingleRead'
              examples:
                VariablesWithDefinition:
                  value:
                  - definition:
                      access_type: READ_ONLY
                      data_type: BOOLEAN
                      experimental: false
                    key: gvl/input-1
                    value: true
                  - definition:
                      access_type: READ_WRITE
                      data_type: BOOLEAN
                      experimental: false
                    key: gvl/input-2
                    value: true
                VariablesWithoutDefinition:
                  value:
                  - key: gvl/input-1
                    value: true
                  - key: gvl/input-2
                    value: true
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '404':
          description: Provider not found.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
      security:
      - OAuth2:
        - hub.variables.readonly
        - hub.variables.readwrite
    post:
      tags:
      - Consumer
      summary: Update variable values of a single provider.
      description: Update all variable values or a subset of variable values of a single provider.
      operationId: post_multiple_variables_handler
      parameters:
      - name: provider_id
        in: path
        description: Id of a provider
        required: true
        schema:
          $ref: '#/components/schemas/ProviderName'
      requestBody:
        description: The request body contains the variable values which shall be updated.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/VariableUpdatePostPayload'
            example:
            - key: gvl/input-1
              value: true
            - key: gvl/input-2
              value: false
        required: true
      responses:
        '200':
          description: |-
            Ok

                        Variable write command was successfully sent.
                        The updated variables are not being returned because the provider may query the write and apply the changes asynchronously. The value write might occur later or could be overridden by another write, thus never being applied.
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '404':
          description: Provider not found.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '422':
          description: Unprocessable entity. The variables in the request body cannot be processed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
      security:
      - OAuth2:
        - hub.variables.readwrite
  /providers/{provider_id}/variables/{variable_key}:
    get:
      tags:
      - Consumer
      summary: Get variable value of a single provider.
      description: Get variable value of a single provider with or without variable definition.
      operationId: get_single_variable_handler
      parameters:
      - name: provider_id
        in: path
        description: Id of a provider
        required: true
        schema:
          $ref: '#/components/schemas/ProviderName'
      - name: variable_key
        in: path
        description: Key of a variable
        required: true
        schema:
          $ref: '#/components/schemas/VariableName'
      - name: definition
        in: query
        description: If true, the response will contain variable definitions.
        required: false
        schema:
          type: boolean
          nullable: true
      responses:
        '200':
          description: A variable value with or without definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSingleRead'
              examples:
                VariableWithDefinition:
                  value:
                    definition:
                      access_type: READ_ONLY
                      data_type: BOOLEAN
                      experimental: false
                    key: gvl/input-1
                    value: true
                VariableWithoutDefinition:
                  value:
                    key: gvl/input-1
                    value: true
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '404':
          description: Not found. The response body contains a detailed error message, e.g. provider not found or variable not found.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
      security:
      - OAuth2:
        - hub.variables.readonly
        - hub.variables.readwrite
    post:
      tags:
      - Consumer
      summary: Update variable value of a single provider.
      description: Update variable value of a single provider.
      operationId: post_single_variable_handler
      parameters:
      - name: provider_id
        in: path
        description: Name of a Provider
        required: true
        schema:
          $ref: '#/components/schemas/ProviderName'
      - name: variable_key
        in: path
        description: Key of a variable
        required: true
        schema:
          $ref: '#/components/schemas/VariableName'
      requestBody:
        description: The request body contains the variable value which shall be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableUpdatePostPayload'
            example:
              key: gvl/input-1
              value: true
        required: true
      responses:
        '200':
          description: ''
        '400':
          description: Bad request.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '401':
          description: Unauthorized.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '404':
          description: Not found. The response body contains a detailed error message, e.g. provider not found or variable not found.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '422':
          description: Unprocessable entity.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
        '500':
          description: Internal Server Error.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormatlessString'
      security:
      - OAuth2:
        - hub.variables.readwrite
components:
  schemas:
    FormatlessString:
      type: string
      format: string
      description: String without special format.
      additionalProperties: true
      maxLength: 1023
    ISO8601Duration:
      type: string
      format: ^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?$
      description: |-
        A duration string according to ISO8601 norm (https://datatracker.ietf.org/doc/html/rfc3339#appendix-A).

        Example: 'PT5H9M39.400S'
      additionalProperties: true
      maxLength: 82
    ISO8601Timestamp:
      type: string
      format: date-time
      description: |-
        A timestamp string according to ISO8601 norm (https://datatracker.ietf.org/doc/html/rfc3339#section-5.6).

        Example: '1970-01-01T00:20:34.000Z'
      additionalProperties: true
      maxLength: 24
    Prefixes:
      type: string
      format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?(\/[a-z]([a-z0-9-]{0,61}[a-z0-9])?)*$
      description: A comma-separated list of prefixes used for listing a subset of variables.
      additionalProperties: true
      maxLength: 1023
    ProviderName:
      type: string
      format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
      description: The id of a provider.
      additionalProperties: true
      maxLength: 63
    ResponseSingleProvider:
      type: object
      description: Response containing a single provider.
      required:
      - id
      properties:
        id:
          type: string
          format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
          maxLength: 63
    ResponseSingleRead:
      type: object
      description: Response object for a single variable.
      required:
      - key
      - value
      properties:
        definition:
          $ref: '#/components/schemas/VariableDefinition'
        key:
          type: string
          format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?(\/[a-z]([a-z0-9-]{0,61}[a-z0-9])?)*$
          maxLength: 1023
        value:
          $ref: '#/components/schemas/VariableValue'
    VariableAccessType:
      type: string
      enum:
      - UNSPECIFIED
      - READ_ONLY
      - READ_WRITE
    VariableDataType:
      type: string
      enum:
      - UNSPECIFIED
      - BOOLEAN
      - DURATION
      - FLOAT64
      - INT64
      - STRING
      - TIMESTAMP
    VariableDefinition:
      type: object
      required:
      - data_type
      - access_type
      - experimental
      properties:
        access_type:
          $ref: '#/components/schemas/VariableAccessType'
        data_type:
          $ref: '#/components/schemas/VariableDataType'
        experimental:
          type: boolean
    VariableName:
      type: string
      format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?(\/[a-z]([a-z0-9-]{0,61}[a-z0-9])?)*$
      description: String that contains the key of a variable.
      additionalProperties: true
      maxLength: 1023
    VariableUpdatePostPayload:
      type: object
      description: The JSON payload of a POST request (to update a single variable) is deserialized into this struct.
      required:
      - key
      - value
      properties:
        key:
          type: string
          format: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?(\/[a-z]([a-z0-9-]{0,61}[a-z0-9])?)*$
          maxLength: 1023
        value:
          $ref: '#/components/schemas/VariableValue'
    VariableValue:
      oneOf:
      - type: integer
        format: int64
      - type: boolean
      - $ref: '#/components/schemas/FormatlessString'
      - type: number
        format: double
      - $ref: '#/components/schemas/ISO8601Duration'
      - $ref: '#/components/schemas/ISO8601Timestamp'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            hub.variables.readonly: Readonly access to Data Hub variables.
            hub.variables.readwrite: Read and write access to Data Hub variables.
      description: The HTTP API uses the OAuth2 client credentials flow.
tags:
- name: Consumer
  description: |-
    A consumer may

      - list/get available providers
      - list/get/update variables published by providers.
