name: "build"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      # Check commit messages
      # Lint everything from the base to the latest
      - name: Run gitlint
        shell: bash
        run: |
          python -m pip install gitlint
          echo "Linting commits:"
          git log --pretty=format:"%h %s" ${{ github.event.pull_request.base.sha }}..HEAD
          gitlint -vvv --commits "${{ github.event.pull_request.base.sha }}..HEAD"

      # Run pre commit hooks
      - name: Run Commit Checks
        uses: j178/prek-action@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run dev container task
        uses: devcontainers/ci@v0.3
        env:
          GITHUB_ACTIONS: "true"
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/devcontainer
          runCmd: just check && just openapi::changelog
